<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,  initial-scale=1.0">
    <title>壮观炸裂顶配按钮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 暗黑全屏背景，衬托极致光效壮观感 */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }

        /* 壮观顶配核心按钮 */
        .epic-epic-btn {
            padding: 1.5rem 4rem;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px; /* 字间距拉开，大气磅礴 */
            color: #fff;
            border: 3px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            user-select: none;
            position: relative;
            overflow: hidden;
            z-index: 1;

            /* 极致炫彩渐变基底（初始就大气） */
            background: linear-gradient(45deg, #ff0080, #7928ca, #00d4ff, #ff9500);
            background-size: 400% 400%;
            animation: gradient-flow 8s ease infinite;

            /* 底层深空阴影，氛围感铺垫 */
            box-shadow: 0 0 30px rgba(121, 40, 202, 0.4), 
                        0 0 60px rgba(0, 212, 255, 0.2);

            /* 顶级丝滑过渡，所有炸裂效果不卡顿 */
            transition: 
                border-color 0.3s cubic-bezier(0.2, 1.2, 0.3, 1),
                transform 0.35s cubic-bezier(0.2, 1.2, 0.3, 1),
                box-shadow 0.4s cubic-bezier(0.2, 1.2, 0.3, 1),
                text-shadow 0.3s cubic-bezier(0.2, 1.2, 0.3, 1);

            will-change: transform, box-shadow;
        }

        /* 1. 渐变无限流动动画（大气永动氛围感） */
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. 多层粒子波纹炸裂（超级壮观扩散） */
        .epic-epic-btn::before, .epic-epic-btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        /* 外层强光巨波纹 */
        .epic-epic-btn::before {
            width: 0; height: 0;
            background: rgba(255, 255, 255, 0.3);
            transition: width 0.8s cubic-bezier(0.2, 1.2, 0.3, 1), 
                        height 0.8s cubic-bezier(0.2, 1.2, 0.3, 1);
        }
        /* 内层炫彩裂变波纹 */
        .epic-epic-btn::after {
            width: 0; height: 0;
            background: rgba(121, 40, 202, 0.4);
            transition: width 0.7s cubic-bezier(0.2, 1.2, 0.3, 1), 
                        height 0.7s cubic-bezier(0.2, 1.2, 0.3, 1);
        }

        /* 3. 边框极光脉冲呼吸（无限震撼闪烁） */
        @keyframes aurora-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.8), 
                              0 0 40px rgba(121, 40, 202, 0.6), 
                              0 0 80px rgba(0, 212, 255, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(255, 255, 255, 0), 
                              0 0 60px rgba(121, 40, 202, 0.8), 
                              0 0 120px rgba(0, 212, 255, 0.6); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0), 
                              0 0 40px rgba(121, 40, 202, 0.6), 
                              0 0 80px rgba(0, 212, 255, 0.4); }
        }

        /* 4. 悬停终极壮观炸裂合集 */
        .epic-epic-btn:hover {
            /* 超大张力超调：倾斜+大幅上浮+强力放大，气场全开 */
            transform: rotate(3deg) scale(1.12) translateY(-8px);
            /* 超厚纯白高光边框，锐利夺目 */
            border-color: #ffffff;
            /* 文字极致强光炸裂发光（刺眼震撼） */
            text-shadow: 0 0 10px #fff, 0 0 25px #fff, 
                         0 0 40px #7928ca, 0 0 60px #00d4ff;
            /* 无限极光脉冲呼吸光效，全程壮观不停歇 */
            animation: gradient-flow 6s ease infinite, aurora-pulse 1.5s infinite;
        }

        /* 悬停触发双层巨型波纹裂变扩散 */
        .epic-epic-btn:hover::before { width: 600px; height: 600px; }
        .epic-epic-btn:hover::after { width: 450px; height: 450px; }

        /* 5. 按压硬核收敛反馈（张力收尾，不杂乱） */
        .epic-epic-btn:active {
            transform: rotate(3deg) scale(1.06) translateY(-2px);
            box-shadow: 0 0 20px rgba(121, 40, 202, 0.7), 
                        0 0 40px rgba(0, 212, 255, 0.5);
            text-shadow: 0 0 8px #fff, 0 0 20px #7928ca;
        }
    </style>
</head>
<body>
    <button class="epic-epic-btn" onclick="alert('极致壮观·炸裂顶配！')">
        壮观终极按钮
    </button>
</body>
</html>
