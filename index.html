<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>只有一个按钮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
        }

        .main-btn {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3);
            user-select: none;
            box-sizing: border-box;
            transform-origin: center center;
            position: relative;
            overflow: hidden;
        }

        .main-btn:hover {
            background-color: #0056b3;
            transform: rotate(10deg) scale(1.5);
            border: 5px solid #ffffff;
            box-shadow: 0 6px 12px rgba(0, 123, 255, 0.2);
        }

        .main-btn:active {
            transform: rotate(5deg) scale(1.1) translateY(2px);
            box-shadow: 0 2px 4px rgba(0, 123, 255, 0.15);
        }

        .main-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            transform: none;
            border: none;
            box-shadow: none;
        }

        /* 碎裂小块 */
        .break-piece {
            position: absolute;
            background: #007bff;
            border-radius: 2px;
            opacity: 0;
            animation: breakAnim 0.6s ease-out forwards;
        }

        @keyframes breakAnim {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(0.4); }
        }
    </style>
</head>
<body>
    <button class="main-btn" id="btn">CLICK ME!</button>

    <script>
        const btn = document.getElementById('btn');

        btn.addEventListener('click', () => {
            alert('触发');

            // 隐藏本体
            btn.style.opacity = 0;

            // 生成碎片
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.classList.add('break-piece');

                const size = Math.random() * 18 + 8;
                const x = (Math.random() - 0.5) * 120;
                const y = (Math.random() - 0.5) * 120;
                const r = (Math.random() - 0.5) * 360;

                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.setProperty('--x', x + 'px');
                p.style.setProperty('--y', y + 'px');
                p.style.setProperty('--r', r + 'deg');

                btn.appendChild(p);
            }

            // 复原
            setTimeout(() => {
                btn.style.opacity = 1;
                btn.innerHTML = 'CLICK ME!';
            }, 800);
        });
    </script>
</body>
</html>
