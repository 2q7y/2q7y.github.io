<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 让手机自动适配屏幕，关键！ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球点击计数器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f0f4f8;
            gap: 30px;
            padding: 20px;
        }

        /* 点击按钮 - 任何设备都好点 */
        #clickBtn {
            padding: 25px 60px;
            font-size: 28px;
            font-weight: bold;
            background: #ff3e6c;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 62, 108, 0.3);
            transition: transform 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #clickBtn:active {
            transform: scale(0.95);
        }

        /* 计数显示 */
        #count {
            font-size: 80px;
            font-weight: bold;
            color: #2d3748;
        }

        /* 提示文字 */
        .tip {
            font-size: 16px;
            color: #718096;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="tip">🌍 全世界共用一个计数器 · 任何设备都能点</div>
    <button id="clickBtn">点我！</button>
    <div id="count">0</div>
    <div class="tip">刷新页面会自动获取最新总数</div>

    <script>
        // 用 GitHub Gist 做免费全球数据同步（无需服务器）
        const GIST_ID = "606c110f8b569d32a590e90c621f1e5f";
        const API_URL = `https://api.github.com/gists/${GIST_ID}`;

        const countEl = document.getElementById("count");
        const clickBtn = document.getElementById("clickBtn");

        // 获取当前计数
        async function getCount() {
            try {
                let res = await fetch(API_URL);
                let data = await res.json();
                let count = data.files["count.txt"].content || 0;
                countEl.textContent = count;
                return Number(count);
            } catch (e) {
                console.log("加载失败");
            }
        }

        // 点击 +1 并同步到全球
        clickBtn.addEventListener("click", async () => {
            clickBtn.disabled = true;
            let current = await getCount();
            let newCount = current + 1;

            try {
                await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        files: {
                            "count.txt": { content: String(newCount) }
                        }
                    })
                });
                countEl.textContent = newCount;
            } catch (e) {
                alert("点击失败，请重试");
            }
            clickBtn.disabled = false;
        });

        // 页面加载时自动获取最新计数
        window.onload = getCount;
    </script>
</body>
</html>
