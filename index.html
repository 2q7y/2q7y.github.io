<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>小游戏大厅</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#111;color:#fff}
.screen{width:100%;max-width:800px;margin:0 auto;padding:20px}
.hidden{display:none}
.title{text-align:center;font-size:32px;margin:20px 0}
.menu{display:grid;gap:16px;margin-top:40px}
.menu button{padding:20px;font-size:20px;border:none;border-radius:12px;background:#2d6df6;color:white;cursor:pointer}
.menu button:hover{background:#1d5ddd}
.back{margin-top:20px;padding:10px 20px;background:#444;color:white;border:none;border-radius:8px;cursor:pointer}
canvas{display:block;border:2px solid #666;background:#000;margin:10px auto;border-radius:8px}
.game-area{position:relative}
#rpgUI{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);padding:10px;border-radius:8px}
.dialog{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#111; padding:16px 20px;border:2px solid #666;border-radius:10px;width:90%;max-width:500px}
.dialog button{margin-top:10px;padding:8px 16px}
</style>
</head>

<body>

<!-- 大厅 -->
<div id="hall" class="screen">
  <h1 class="title">🎮 小游戏大厅</h1>
  <div class="menu">
    <button onclick="startBrick()">🧱 打砖块</button>
    <button onclick="startPlane()">✈️ 飞机大战</button>
    <button onclick="startRPG()">🏡 RPG · 拯救村庄</button>
  </div>
</div>

<!-- 打砖块 -->
<div id="brickGame" class="screen hidden">
  <h2 class="title">🧱 打砖块</h2>
  <canvas id="brickCanvas" width="600" height="400"></canvas>
  <button class="back" onclick="backHall()">返回大厅</button>
</div>

<!-- 飞机大战 -->
<div id="planeGame" class="screen hidden">
  <h2 class="title">✈️ 飞机大战</h2>
  <canvas id="planeCanvas" width="400" height="600"></canvas>
  <button class="back" onclick="backHall()">返回大厅</button>
</div>

<!-- RPG -->
<div id="rpgGame" class="screen hidden">
  <h2 class="title">🏡 拯救村庄</h2>
  <div class="game-area">
    <canvas id="rpgCanvas" width="480" height="480"></canvas>
    <div id="rpgUI">
      <div>HP: <span id="rpgHp">100</span></div>
      <div>金币: <span id="rpgGold">0</span></div>
      <div>等级: <span id="rpgLv">1</span></div>
    </div>
    <div id="dialog" class="dialog hidden">
      <div id="dialogText"></div>
      <button onclick="closeDialog()">继续</button>
    </div>
  </div>
  <button class="back" onclick="backHall()">返回大厅</button>
</div>

<script>
//============= 全局 =============
let currentScreen = 'hall'
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'))
  document.getElementById(id).classList.remove('hidden')
  currentScreen = id
}
function backHall(){
  showScreen('hall')
  clearAllIntervals()
}
function clearAllIntervals(){
  for(let i=0;i<9999;i++) clearInterval(i)
}

//============= 打砖块 =============
function startBrick(){
  showScreen('brickGame')
  const c=document.getElementById('brickCanvas').getContext('2d')
  const W=600,H=400
  let paddle={x:250,y:380,w:100,h:10}
  let ball={x:300,y:300,r:6,vx:3,vy:-4}
  let bricks=[],score=0,gameOver=false
  for(let i=0;i<5;i++)for(let j=0;j<8;j++)bricks.push({x:j*75+5,y:i*25+30,w:70,h:20,live:1})
  function loop(){
    if(gameOver)return
    c.fillStyle='#000'
    c.fillRect(0,0,W,H)
    c.fillStyle='#fff'
    c.fillRect(paddle.x,paddle.y,paddle.w,paddle.h)
    c.beginPath()
    c.arc(ball.x,ball.y,ball.r,0,Math.PI*2)
    c.fill()
    ball.x+=ball.vx
    ball.y+=ball.vy
    if(ball.x<0||ball.x>W)ball.vx*=-1
    if(ball.y<0)ball.vy*=-1
    if(ball.y>paddle.y&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w)ball.vy*=-1
    if(ball.y>H){gameOver=true;alert('游戏结束 得分:'+score)}
    bricks.forEach(b=>{
      if(b.live){
        c.fillStyle='#46d'
        c.fillRect(b.x,b.y,b.w,b.h)
        if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){
          ball.vy*=-1;b.live=0;score+=10
        }
      }
    })
  }
  document.onmousemove=e=>{
    const r=document.getElementById('brickCanvas').getBoundingClientRect()
    paddle.x=Math.max(0,Math.min(W-paddle.w,e.clientX-r.left))
  }
  setInterval(loop,16)
}

//============= 飞机大战 =============
function startPlane(){
  showScreen('planeGame')
  const c=document.getElementById('planeCanvas').getContext('2d')
  const W=400,H=600
  let p={x:175,y:500,w:50,h:40,bullet:[]}
  let enemy=[],bulletE=[],score=0,gameOver=false
  function addEnemy(){enemy.push({x:Math.random()*(W-40),y:-40,w:40,h:30})}
  setInterval(addEnemy,800)
  document.onkeydown=e=>{
    if(e.key=='ArrowLeft')p.x=Math.max(0,p.x-15)
    if(e.key=='ArrowRight')p.x=Math.min(W-p.w,p.x+15)
    if(e.key==' '){
      p.bullet.push({x:p.x+p.w/2-2,y:p.y-10})
    }
  }
  function loop(){
    if(gameOver)return
    c.fillStyle='#000'
    c.fillRect(0,0,W,H)
    c.fillStyle='#0f0'
    c.fillRect(p.x,p.y,p.w,p.h)
    p.bullet.forEach((b,i)=>{
      b.y-=8
      c.fillRect(b.x,b.y,4,10)
      if(b.y<0)p.bullet.splice(i,1)
    })
    enemy.forEach((e,i)=>{
      e.y+=4
      c.fillStyle='#f44'
      c.fillRect(e.x,e.y,e.w,e.h)
      if(e.y>H){enemy.splice(i,1);gameOver=1;alert('游戏结束 得分:'+score)}
      p.bullet.forEach((b,j)=>{
        if(b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
          enemy.splice(i,1)
          p.bullet.splice(j,1)
          score+=10
        }
      })
      if(e.x+e.w>p.x&&e.x<p.x+p.w&&e.y+e.h>p.y&&e.y<p.y+p.h)gameOver=1
    })
  }
  setInterval(loop,16)
}

//============= RPG 拯救村庄 =============
function startRPG(){
  showScreen('rpgGame')
  const c=document.getElementById('rpgCanvas').getContext('2d')
  const size=32,mapW=15,mapH=15
  let player={x:7,y:7,hp:100,gold:0,lv:1,atk:10}
  let map=Array(mapH).fill().map(()=>Array(mapW).fill(0))
  let step=0,msg=''
  function dialog(t){
    document.getElementById('dialogText').innerText=t
    document.getElementById('dialog').classList.remove('hidden')
  }
  function closeDialog(){document.getElementById('dialog').classList.add('hidden')}
  function updateUI(){
    document.getElementById('rpgHp').innerText=player.hp
    document.getElementById('rpgGold').innerText=player.gold
    document.getElementById('rpgLv').innerText=player.lv
  }
  function draw(){
    c.fillStyle='#1a1'
    c.fillRect(0,0,480,480)
    for(let i=0;i<mapH;i++){
      for(let j=0;j<mapW;j++){
        if(map[i][j]==1){c.fillStyle='#642';c.fillRect(j*size,i*size,size,size)}
      }
    }
    c.fillStyle='#28f'
    c.fillRect(player.x*size+2,player.y*size+2,size-4,size-4)
  }
  function enemyBattle(){
    player.hp-=Math.floor(Math.random()*8+3)
    player.gold+=Math.floor(Math.random()*5+2)
    if(player.hp<=0){
      dialog('你被怪物击败了…')
      player.hp=100
    }else{
      dialog('你击败了怪物！获得金币')
    }
    updateUI()
  }
  function checkStep(){
    step++
    if(step%12==0){
      if(Math.random()<0.4)enemyBattle()
    }
    if(step==60){
      dialog('你来到了被怪物袭击的村庄，村民需要你的帮助！')
    }
    if(step==120){
      dialog('你消灭了村庄附近的怪物，成功拯救了村庄！')
      player.lv=2
      updateUI()
    }
  }
  document.onkeydown=e=>{
    let ox=0,oy=0
    if(e.key=='ArrowUp')oy=-1
    if(e.key=='ArrowDown')oy=1
    if(e.key=='ArrowLeft')ox=-1
    if(e.key=='ArrowRight')ox=1
    const nx=player.x+ox,ny=player.y+oy
    if(nx>=0&&nx<mapW&&ny>=0&&ny<mapH){
      player.x=nx;player.y=oy+player.y
      checkStep();draw()
    }
  }
  updateUI()
  draw()
  dialog('欢迎来到冒险！方向键移动，拯救被怪物袭击的村庄。')
}
</script>
</body>
</html>
