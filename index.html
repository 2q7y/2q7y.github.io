<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎒 上学记 - 别迟到啦！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Comic Sans MS", "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .game-title {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .game-info {
            display: flex;
            gap: 30px;
            margin-bottom: 10px;
            font-size: 18px;
            color: #34495e;
        }

        #gameCanvas {
            border: 4px solid #3498db;
            border-radius: 12px;
            background: #ecf0f1;
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.2);
        }

        .btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 #27ae60;
        }

        .btn:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #219955;
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 0 #219955;
        }

        .dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 100;
            display: none;
            max-width: 80%;
        }

        .dialog h2 {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .dialog p {
            color: #34495e;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            display: none;
        }
    </style>
</head>
<body>
    <h1 class="game-title">🎒 上学记 - 别迟到啦！</h1>
    <div class="game-info">
        <div>时间：<span id="time">10:00</span></div>
        <div>文具：<span id="stationery">0</span>/5</div>
        <div>状态：<span id="status">出发！</span></div>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <button class="btn" id="startBtn">开始上学</button>

    <!-- 弹窗 -->
    <div class="mask" id="mask"></div>
    <div class="dialog" id="lateDialog">
        <h2>😱 迟到啦！</h2>
        <p>路上磨磨蹭蹭，被老师批评了...</p>
        <button class="btn" onclick="restartGame()">重新出发</button>
    </div>
    <div class="dialog" id="successDialog">
        <h2>🎉 准时到校！</h2>
        <p>收集了 <span id="finalStationery">0</span> 件文具，今天也是认真上学的一天～</p>
        <button class="btn" onclick="restartGame()">再来一次</button>
    </div>
    <div class="dialog" id="classDialog">
        <h2>📝 课堂小测试</h2>
        <p>1+1=？ 点击正确答案！</p>
        <div style="display: flex; gap: 20px; justify-content: center;">
            <button class="btn" onclick="classTest(false)">1</button>
            <button class="btn" onclick="classTest(true)">2</button>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timeText = document.getElementById('time');
        const stationeryText = document.getElementById('stationery');
        const statusText = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const mask = document.getElementById('mask');
        const lateDialog = document.getElementById('lateDialog');
        const successDialog = document.getElementById('successDialog');
        const classDialog = document.getElementById('classDialog');
        const finalStationeryText = document.getElementById('finalStationery');

        // 游戏配置
        const gameConfig = {
            player: {
                x: 50,
                y: canvas.height - 80,
                w: 40,
                h: 60,
                speed: 5,
                jumpPower: -12,
                vy: 0,
                gravity: 0.6
            },
            obstacles: [
                { x: 200, y: canvas.height - 50, w: 80, h: 20, type: 'puddle', color: '#3498db' },
                { x: 400, y: canvas.height - 50, w: 60, h: 20, type: 'rock', color: '#7f8c8d' },
                { x: 550, y: canvas.height - 50, w: 100, h: 20, type: 'puddle', color: '#3498db' },
                { x: 700, y: canvas.height - 50, w: 70, h: 20, type: 'rock', color: '#7f8c8d' },
                { x: 850, y: canvas.height - 50, w: 90, h: 20, type: 'puddle', color: '#3498db' }
            ],
            stationeries: [
                { x: 150, y: canvas.height - 100, type: 'pen', collected: false },
                { x: 300, y: canvas.height - 100, type: 'book', collected: false },
                { x: 450, y: canvas.height - 100, type: 'ruler', collected: false },
                { x: 600, y: canvas.height - 100, type: 'eraser', collected: false },
                { x: 750, y: canvas.height - 100, type: 'pencil', collected: false }
            ],
            time: 10, // 初始时间（分钟）
            maxTime: 15, // 迟到时间
            stationeryCount: 0,
            gameStarted: false,
            gameOver: false,
            isJumping: false,
            classTestTriggered: false,
            backgroundX: 0, // 背景滚动
            speed: 3 // 场景滚动速度
        };

        // 初始化游戏
        function initGame() {
            gameConfig.player.x = 50;
            gameConfig.player.y = canvas.height - 80;
            gameConfig.player.vy = 0;
            gameConfig.obstacles.forEach(obs => {
                obs.x = Math.random() * 300 + 200 + (obs.x % 300);
            });
            gameConfig.stationeries.forEach(s => {
                s.collected = false;
                s.x = Math.random() * 300 + 150 + (s.x % 300);
            });
            gameConfig.time = 10;
            gameConfig.stationeryCount = 0;
            gameConfig.gameStarted = false;
            gameConfig.gameOver = false;
            gameConfig.isJumping = false;
            gameConfig.classTestTriggered = false;
            gameConfig.backgroundX = 0;

            updateUI();
            drawGame();
            startBtn.style.display = 'block';
            mask.style.display = 'none';
            lateDialog.style.display = 'none';
            successDialog.style.display = 'none';
            classDialog.style.display = 'none';
        }

        // 更新UI
        function updateUI() {
            timeText.textContent = `${gameConfig.time}:00`;
            stationeryText.textContent = gameConfig.stationeryCount;
            
            if (gameConfig.gameStarted) {
                if (gameConfig.time < 13) statusText.textContent = '顺利前进～';
                else if (gameConfig.time < 15) statusText.textContent = '要迟到啦！';
                else statusText.textContent = '迟到了！';
            } else {
                statusText.textContent = '准备出发！';
            }
        }

        // 绘制游戏
        function drawGame() {
            // 清空画布
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制背景（道路+草地）
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30); // 道路
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(0, 0, canvas.width, canvas.height - 30); // 草地

            // 绘制远处树木
            ctx.fillStyle = '#27ae60';
            for (let i = 0; i < 10; i++) {
                const x = i * 100 + gameConfig.backgroundX % 100;
                ctx.fillRect(x, canvas.height - 100, 10, 70); // 树干
                ctx.beginPath();
                ctx.arc(x + 5, canvas.height - 120, 20, 0, Math.PI * 2);
                ctx.fill(); // 树冠
            }

            // 绘制玩家（简笔画小人）
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(gameConfig.player.x, gameConfig.player.y, gameConfig.player.w, gameConfig.player.h); // 身体
            ctx.fillStyle = '#f39c12';
            ctx.beginPath();
            ctx.arc(gameConfig.player.x + 20, gameConfig.player.y - 10, 15, 0, Math.PI * 2);
            ctx.fill(); // 头

            // 绘制障碍物
            gameConfig.obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x - gameConfig.backgroundX, obs.y, obs.w, obs.h);
                
                // 绘制障碍物细节
                if (obs.type === 'puddle') {
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.5)';
                    ctx.fillRect(obs.x - gameConfig.backgroundX + 10, obs.y - 5, obs.w - 20, 10);
                } else if (obs.type === 'rock') {
                    ctx.fillStyle = 'rgba(127, 140, 141, 0.6)';
                    ctx.beginPath();
                    ctx.arc(obs.x - gameConfig.backgroundX + obs.w/2, obs.y - 5, obs.w/4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // 绘制文具
            gameConfig.stationeries.forEach(s => {
                if (s.collected) return;
                ctx.fillStyle = '#9b59b6';
                const x = s.x - gameConfig.backgroundX;
                const y = s.y;

                // 绘制不同文具形状
                if (s.type === 'pen') {
                    ctx.fillRect(x, y, 5, 20);
                } else if (s.type === 'book') {
                    ctx.fillRect(x, y, 20, 15);
                    ctx.strokeStyle = 'white';
                    ctx.strokeRect(x + 2, y + 2, 16, 11);
                } else if (s.type === 'ruler') {
                    ctx.fillRect(x, y + 5, 25, 5);
                } else if (s.type === 'eraser') {
                    ctx.fillRect(x, y, 15, 15);
                } else if (s.type === 'pencil') {
                    ctx.fillRect(x, y, 5, 20);
                    ctx.fillStyle = '#f39c12';
                    ctx.beginPath();
                    ctx.moveTo(x + 2.5, y);
                    ctx.lineTo(x - 2, y - 5);
                    ctx.lineTo(x + 7, y - 5);
                    ctx.fill();
                }
            });

            // 绘制学校大门（终点）
            const gateX = 1000 - gameConfig.backgroundX;
            ctx.fillStyle = '#34495e';
            ctx.fillRect(gateX, canvas.height - 100, 80, 100); // 门框
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(gateX + 10, canvas.height - 90, 60, 80); // 门
            ctx.fillStyle = 'gold';
            ctx.fillRect(gateX + 35, canvas.height - 50, 10, 20); // 门把手
        }

        // 游戏逻辑更新
        function updateGame() {
            if (!gameConfig.gameStarted || gameConfig.gameOver) return;

            // 背景滚动（场景前进）
            gameConfig.backgroundX += gameConfig.speed;

            // 玩家重力和跳跃
            gameConfig.player.vy += gameConfig.player.gravity;
            gameConfig.player.y += gameConfig.player.vy;

            // 地面碰撞检测
            if (gameConfig.player.y >= canvas.height - 80) {
                gameConfig.player.y = canvas.height - 80;
                gameConfig.player.vy = 0;
                gameConfig.isJumping = false;
            }

            // 障碍物碰撞检测
            gameConfig.obstacles.forEach(obs => {
                const obsX = obs.x - gameConfig.backgroundX;
                if (
                    gameConfig.player.x + gameConfig.player.w > obsX &&
                    gameConfig.player.x < obsX + obs.w &&
                    gameConfig.player.y + gameConfig.player.h > obs.y &&
                    gameConfig.player.y < obs.y + obs.h
                ) {
                    // 撞到障碍物，时间增加（变慢）
                    gameConfig.time += 0.2;
                    updateUI();
                }
            });

            // 文具收集
            gameConfig.stationeries.forEach(s => {
                if (s.collected) return;
                const sX = s.x - gameConfig.backgroundX;
                if (
                    gameConfig.player.x + gameConfig.player.w > sX - 10 &&
                    gameConfig.player.x < sX + 20 &&
                    gameConfig.player.y + gameConfig.player.h > s.y - 10 &&
                    gameConfig.player.y < s.y + 20
                ) {
                    s.collected = true;
                    gameConfig.stationeryCount++;
                    updateUI();
                }
            });

            // 时间更新（每20帧减少0.1分钟）
            if (frameCount % 20 === 0) {
                gameConfig.time += 0.1;
                updateUI();

                // 迟到判断
                if (gameConfig.time >= gameConfig.maxTime) {
                    gameOver(false);
                }
            }

            // 到达学校（终点）
            if (gameConfig.backgroundX >= 950) {
                gameOver(true);
            }

            // 触发课堂小测试（收集3个文具后）
            if (gameConfig.stationeryCount >= 3 && !gameConfig.classTestTriggered) {
                gameConfig.classTestTriggered = true;
                gameConfig.gameStarted = false;
                mask.style.display = 'block';
                classDialog.style.display = 'block';
            }

            frameCount++;
        }

        // 课堂测试
        function classTest(isCorrect) {
            mask.style.display = 'none';
            classDialog.style.display = 'none';
            gameConfig.gameStarted = true;

            if (isCorrect) {
                // 答对了，时间减少（加速）
                gameConfig.time -= 1;
                statusText.textContent = '答题正确！加速前进～';
            } else {
                // 答错了，时间增加（减速）
                gameConfig.time += 1;
                statusText.textContent = '答错啦，要加快速度！';
            }
            updateUI();
        }

        // 游戏结束
        function gameOver(isSuccess) {
            gameConfig.gameOver = true;
            mask.style.display = 'block';

            if (isSuccess) {
                finalStationeryText.textContent = gameConfig.stationeryCount;
                successDialog.style.display = 'block';
            } else {
                lateDialog.style.display = 'block';
            }
        }

        // 跳跃控制
        function jump() {
            if (!gameConfig.gameStarted || gameConfig.isJumping) return;
            gameConfig.player.vy = gameConfig.player.jumpPower;
            gameConfig.isJumping = true;
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowUp') {
                jump();
            }
            if (e.key === 'ArrowRight' && gameConfig.gameStarted) {
                gameConfig.player.x += gameConfig.player.speed;
            }
            if (e.key === 'ArrowLeft' && gameConfig.gameStarted) {
                gameConfig.player.x = Math.max(0, gameConfig.player.x - gameConfig.player.speed);
            }
        });

        // 鼠标/触摸控制
        canvas.addEventListener('click', (e) => {
            if (gameConfig.gameStarted) {
                jump();
            }
        });

        // 开始游戏
        startBtn.addEventListener('click', () => {
            gameConfig.gameStarted = true;
            startBtn.style.display = 'none';
            frameCount = 0;
            gameLoop();
        });

        // 重新开始
        function restartGame() {
            initGame();
        }

        // 游戏主循环
        let frameCount = 0;
        function gameLoop() {
            updateGame();
            drawGame();
            if (!gameConfig.gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // 初始化
        initGame();
    </script>
</body>
</html>
