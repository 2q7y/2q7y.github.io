<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>只有一个按钮</title>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面整体样式 - 让按钮居中显示 */
        body {
            min-height: 100vh;
            /* 使用flex布局让按钮水平+垂直居中 */
            display: flex;
            align-items: center;
            justify-content: center;
            /* 极简背景色（可自行修改） */
            background-color: #f5f5f5;
        }

        /* 按钮核心样式 */
        .main-btn {
            /* 按钮尺寸 */
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            /* 视觉样式 */
            background-color: #007bff;
            color: white;
            border: none; /* 默认无边框 */
            border-radius: 8px;
            cursor: pointer;
            /* 过渡动画 - 让所有样式变化更流畅 */
            transition: all 0.2s ease;
            /* 按钮阴影 */
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3);
            /* 防止按钮文字被选中 */
            user-select: none;
            /* 预留边框空间，避免悬停时按钮位移 */
            box-sizing: border-box;
            /* 新增：设置变换原点，让缩放从中心开始 */
            transform-origin: center center;
        }

        /* 鼠标悬停效果 - 核心修改部分 */
        .main-btn:hover {
            background-color: #0056b3;
            /* 1. 按钮倾斜+缩放增大：rotate保持倾斜，scale(1.2)表示放大到1.2倍，可调整 */
            transform: rotate(10deg) scale(1.5);
            /* 2. 添加白色边框：调整为2px更美观（原10px过宽） */
            border: 5px solid #ffffff;
            /* 优化阴影，增强视觉效果 */
            box-shadow: 0 6px 12px rgba(0, 123, 255, 0.2);
        }

        /* 点击按下效果 */
        .main-btn:active {
            /* 保持倾斜和缩放，同时按下 */
            transform: rotate(5deg) scale(1.1) translateY(2px);
            box-shadow: 0 2px 4px rgba(0, 123, 255, 0.15);
        }

        /* 禁用状态（可选） */
        .main-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            transform: none;
            border: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <!-- 唯一的按钮元素 -->
    <button class="main-btn" onclick="alert('触发')">CLICK ME!</button>
</body>
</html>
