<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易增量游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .resource-panel {
            flex: 1;
            min-width: 300px;
            background-color: #16213e;
            padding: 20px;
            border-radius: 10px;
        }

        .upgrade-panel {
            flex: 2;
            min-width: 500px;
            background-color: #16213e;
            padding: 20px;
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .resource-display {
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .clicker-btn {
            width: 100%;
            height: 150px;
            background-color: #0f3460;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .clicker-btn:hover {
            background-color: #533483;
            transform: scale(1.02);
        }

        .upgrade-card {
            background-color: #0f3460;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upgrade-card:hover {
            background-color: #533483;
            transform: translateY(-2px);
        }

        .upgrade-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-card.locked:hover {
            background-color: #0f3460;
            transform: none;
        }

        .upgrade-name {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .upgrade-cost {
            font-size: 14px;
            color: #a8d8ff;
        }

        .upgrade-effect {
            font-size: 14px;
            color: #f0e68c;
            margin-top: 5px;
        }

        .stats {
            margin-top: 20px;
            font-size: 16px;
            color: #a8d8ff;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 资源面板 -->
        <div class="resource-panel">
            <div class="resource-display">
                <span>金币: <span id="gold">0</span></span>
                <span>每秒金币: <span id="goldPerSecond">0</span></span>
            </div>

            <button class="clicker-btn" id="clickerBtn">点击获取金币</button>

            <div class="stats">
                <p>点击收益: <span id="clickValue">1</span> 金币/次</p>
                <p>已解锁升级: <span id="unlockedUpgrades">0</span>/4</p>
            </div>
        </div>

        <!-- 升级面板 -->
        <div class="upgrade-panel">
            <!-- 升级1: 初级矿工 -->
            <div class="upgrade-card" id="upgrade1">
                <div class="upgrade-name">初级矿工</div>
                <div class="upgrade-cost">成本: <span id="upgrade1Cost">10</span> 金币</div>
                <div class="upgrade-effect">效果: +0.5 金币/秒</div>
            </div>

            <!-- 升级2: 金矿 -->
            <div class="upgrade-card locked" id="upgrade2">
                <div class="upgrade-name">金矿</div>
                <div class="upgrade-cost">成本: <span id="upgrade2Cost">50</span> 金币</div>
                <div class="upgrade-effect">效果: +2 金币/秒</div>
            </div>

            <!-- 升级3: 点击强化 -->
            <div class="upgrade-card locked" id="upgrade3">
                <div class="upgrade-name">点击强化</div>
                <div class="upgrade-cost">成本: <span id="upgrade3Cost">30</span> 金币</div>
                <div class="upgrade-effect">效果: 点击收益+1</div>
            </div>

            <!-- 升级4: 自动化工厂 -->
            <div class="upgrade-card locked" id="upgrade4">
                <div class="upgrade-name">自动化工厂</div>
                <div class="upgrade-cost">成本: <span id="upgrade4Cost">200</span> 金币</div>
                <div class="upgrade-effect">效果: +10 金币/秒</div>
            </div>
        </div>
    </div>

    <script>
        // 游戏状态管理
        const gameState = {
            gold: 0,                // 当前金币数量
            goldPerSecond: 0,       // 每秒获得的金币
            clickValue: 1,          // 每次点击获得的金币
            upgrades: {
                // 升级配置: 成本、效果、是否解锁、是否购买
                upgrade1: { cost: 10, effect: 0.5, unlocked: true, purchased: false },
                upgrade2: { cost: 50, effect: 2, unlocked: false, purchased: false },
                upgrade3: { cost: 30, effect: 1, unlocked: false, purchased: false },
                upgrade4: { cost: 200, effect: 10, unlocked: false, purchased: false }
            },
            unlockedUpgradesCount: 0 // 已解锁升级数量
        };

        // DOM 元素引用
        const elements = {
            gold: document.getElementById('gold'),
            goldPerSecond: document.getElementById('goldPerSecond'),
            clickerBtn: document.getElementById('clickerBtn'),
            clickValue: document.getElementById('clickValue'),
            unlockedUpgrades: document.getElementById('unlockedUpgrades'),
            upgrade1: document.getElementById('upgrade1'),
            upgrade1Cost: document.getElementById('upgrade1Cost'),
            upgrade2: document.getElementById('upgrade2'),
            upgrade2Cost: document.getElementById('upgrade2Cost'),
            upgrade3: document.getElementById('upgrade3'),
            upgrade3Cost: document.getElementById('upgrade3Cost'),
            upgrade4: document.getElementById('upgrade4'),
            upgrade4Cost: document.getElementById('upgrade4Cost')
        };

        // 更新UI显示
        function updateUI() {
            elements.gold.textContent = gameState.gold.toFixed(1);
            elements.goldPerSecond.textContent = gameState.goldPerSecond.toFixed(1);
            elements.clickValue.textContent = gameState.clickValue;
            elements.unlockedUpgrades.textContent = gameState.unlockedUpgradesCount;

            // 更新升级成本显示
            elements.upgrade1Cost.textContent = gameState.upgrades.upgrade1.cost;
            elements.upgrade2Cost.textContent = gameState.upgrades.upgrade2.cost;
            elements.upgrade3Cost.textContent = gameState.upgrades.upgrade3.cost;
            elements.upgrade4Cost.textContent = gameState.upgrades.upgrade4.cost;

            // 更新升级解锁状态
            Object.keys(gameState.upgrades).forEach(upgradeId => {
                const upgrade = gameState.upgrades[upgradeId];
                const element = elements[upgradeId];
                
                if (upgrade.unlocked) {
                    element.classList.remove('locked');
                } else {
                    element.classList.add('locked');
                }
            });
        }

        // 点击获取金币
        function handleClick() {
            gameState.gold += gameState.clickValue;
            updateUI();
            
            // 解锁新升级的条件
            checkUpgradeUnlocks();
        }

        // 检查升级解锁条件
        function checkUpgradeUnlocks() {
            // 解锁升级2: 金矿 (金币 >= 30)
            if (!gameState.upgrades.upgrade2.unlocked && gameState.gold >= 30) {
                gameState.upgrades.upgrade2.unlocked = true;
                gameState.unlockedUpgradesCount++;
            }

            // 解锁升级3: 点击强化 (金币 >= 20)
            if (!gameState.upgrades.upgrade3.unlocked && gameState.gold >= 20) {
                gameState.upgrades.upgrade3.unlocked = true;
                gameState.unlockedUpgradesCount++;
            }

            // 解锁升级4: 自动化工厂 (购买了前3个升级)
            const hasPurchased1 = gameState.upgrades.upgrade1.purchased;
            const hasPurchased2 = gameState.upgrades.upgrade2.purchased;
            const hasPurchased3 = gameState.upgrades.upgrade3.purchased;
            
            if (!gameState.upgrades.upgrade4.unlocked && hasPurchased1 && hasPurchased2 && hasPurchased3) {
                gameState.upgrades.upgrade4.unlocked = true;
                gameState.unlockedUpgradesCount++;
            }
        }

        // 购买升级
        function purchaseUpgrade(upgradeId) {
            const upgrade = gameState.upgrades[upgradeId];
            
            // 检查是否解锁且有足够金币
            if (!upgrade.unlocked || gameState.gold < upgrade.cost || upgrade.purchased) {
                return;
            }

            // 扣除金币
            gameState.gold -= upgrade.cost;
            
            // 根据升级类型应用效果
            switch(upgradeId) {
                case 'upgrade1':
                case 'upgrade2':
                case 'upgrade4':
                    gameState.goldPerSecond += upgrade.effect;
                    break;
                case 'upgrade3':
                    gameState.clickValue += upgrade.effect;
                    break;
            }

            // 标记为已购买
            upgrade.purchased = true;
            
            // 升级购买后成本上涨（增量游戏常见机制）
            upgrade.cost = Math.floor(upgrade.cost * 1.5);
            
            updateUI();
            checkUpgradeUnlocks();
        }

        // 自动获取金币（每秒）
        function autoGainGold() {
            gameState.gold += gameState.goldPerSecond / 10; // 每100ms更新一次，所以除以10
            updateUI();
            checkUpgradeUnlocks();
        }

        // 初始化事件监听
        function initEventListeners() {
            // 点击按钮获取金币
            elements.clickerBtn.addEventListener('click', handleClick);
            
            // 升级购买事件
            elements.upgrade1.addEventListener('click', () => purchaseUpgrade('upgrade1'));
            elements.upgrade2.addEventListener('click', () => purchaseUpgrade('upgrade2'));
            elements.upgrade3.addEventListener('click', () => purchaseUpgrade('upgrade3'));
            elements.upgrade4.addEventListener('click', () => purchaseUpgrade('upgrade4'));
        }

        // 游戏初始化
        function initGame() {
            gameState.unlockedUpgradesCount = 1; // 初始解锁1个升级
            updateUI();
            initEventListeners();
            // 每100ms自动获取金币（更流畅的体验）
            setInterval(autoGainGold, 100);
        }

        // 启动游戏
        initGame();
    </script>
</body>
</html>
