<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水墨晕染东方艺术</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#f2efe9;
}

.ink-wash-btn{
  padding:1.4rem 3.8rem;
  font-size:1.2rem;
  letter-spacing:3px;
  color:#333;
  background:#e9e5dc;
  border:none;
  border-radius:6px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:all .5s ease;
}

.ink-wash-btn::after{
  content:"";position:absolute;top:0;left:-120%;width:100%;height:100%;
  background:radial-gradient(ellipse,rgba(0,0,0,0.08),transparent 70%);
  transition:left .6s ease;
}

.ink-wash-btn:hover{
  color:#000;
  background:#e2ddd0;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
}
.ink-wash-btn:hover::after{left:120%;}

.ink-wash-btn:active{transform:scale(0.98);}
</style>
</head>
<body>
<button class="ink-wash-btn">水墨入境</button>
</body>
</html>
