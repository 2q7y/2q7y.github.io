<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终端命令行模拟器 | 好玩又酷炫</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Consolas", "Monaco", "Courier New", monospace;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 终端容器 */
        .terminal {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background-color: #0f0f0f;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 153, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 终端顶部标题栏 */
        .terminal-header {
            background-color: #2d2d2d;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red {
            background-color: #ff5f56;
        }

        .dot-yellow {
            background-color: #ffbd2e;
        }

        .dot-green {
            background-color: #27c93f;
        }

        .terminal-title {
            color: #ccc;
            font-size: 14px;
            flex: 1;
            text-align: center;
        }

        /* 终端内容区域 */
        .terminal-body {
            flex: 1;
            padding: 20px;
            color: #00ff99;
            font-size: 16px;
            overflow-y: auto;
            line-height: 1.5;
        }

        /* 滚动条样式美化 */
        .terminal-body::-webkit-scrollbar {
            width: 8px;
        }

        .terminal-body::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .terminal-body::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* 命令输入区域 */
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .prompt {
            color: #00cc66;
            margin-right: 10px;
        }

        #commandInput {
            background: transparent;
            border: none;
            outline: none;
            color: #00ff99;
            font-size: 16px;
            flex: 1;
            caret-color: #00ff99;
        }

        /* 文本样式 */
        .welcome-text {
            margin-bottom: 20px;
        }

        .help-text {
            color: #ff9900;
        }

        .error-text {
            color: #ff4444;
        }

        .success-text {
            color: #00ff99;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .terminal {
                height: 500px;
            }
            .terminal-body {
                font-size: 14px;
            }
            #commandInput {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <!-- 终端顶部标题栏 -->
        <div class="terminal-header">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">趣味终端模拟器 (fun-terminal v1.0)</div>
        </div>

        <!-- 终端内容区域 -->
        <div class="terminal-body" id="terminalOutput">
            <div class="welcome-text">
                欢迎使用趣味终端模拟器！🎉<br>
                输入 <span class="help-text">help</span> 查看可用命令<br>
                ──────────────────────────────
            </div>
            <!-- 命令输出会动态添加到这里 -->
        </div>
    </div>

    <script>
        // 获取DOM元素
        const terminalOutput = document.getElementById('terminalOutput');
        let commandInput; // 动态创建的输入框

        // 命令历史记录
        let commandHistory = [];
        let historyIndex = -1;

        // 初始化：创建输入行
        function initInputLine() {
            const inputLine = document.createElement('div');
            inputLine.className = 'input-line';
            inputLine.innerHTML = `
                <span class="prompt">user@fun-terminal:~$</span>
                <input type="text" id="commandInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            `;
            terminalOutput.appendChild(inputLine);
            commandInput = document.getElementById('commandInput');
            commandInput.focus();

            // 绑定输入事件
            commandInput.addEventListener('keydown', handleKeyPress);
        }

        // 处理键盘按键
        function handleKeyPress(e) {
            // 回车执行命令
            if (e.key === 'Enter') {
                const command = commandInput.value.trim();
                if (command) {
                    // 添加到历史记录
                    commandHistory.push(command);
                    historyIndex = commandHistory.length;
                    // 执行命令
                    executeCommand(command);
                    // 清空输入框
                    commandInput.value = '';
                }
            }
            // 上方向键：查看上一条命令
            else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    commandInput.value = commandHistory[historyIndex];
                }
            }
            // 下方向键：查看下一条命令
            else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    commandInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    commandInput.value = '';
                }
            }
        }

        // 执行命令
        function executeCommand(command) {
            // 显示输入的命令
            const commandLine = document.createElement('div');
            commandLine.innerHTML = `<span class="prompt">user@fun-terminal:~$</span> ${command}`;
            terminalOutput.appendChild(commandLine);

            // 命令处理逻辑
            const cmd = command.toLowerCase();
            let output = '';

            switch (cmd) {
                case 'help':
                    output = `
                        <span class="help-text">可用命令：</span><br>
                        help      - 查看帮助信息<br>
                        clear     - 清空终端<br>
                        date      - 查看当前时间<br>
                        whoami    - 查看当前用户<br>
                        joke      - 讲一个冷笑话<br>
                        about     - 关于本终端<br>
                        echo [内容] - 输出指定内容
                    `;
                    break;
                case 'clear':
                    terminalOutput.innerHTML = '';
                    const welcomeText = document.createElement('div');
                    welcomeText.className = 'welcome-text';
                    welcomeText.innerHTML = `
                        欢迎使用趣味终端模拟器！🎉<br>
                        输入 <span class="help-text">help</span> 查看可用命令<br>
                        ──────────────────────────────
                    `;
                    terminalOutput.appendChild(welcomeText);
                    break;
                case 'date':
                    output = `<span class="success-text">当前时间：${new Date().toLocaleString()}</span>`;
                    break;
                case 'whoami':
                    output = `<span class="success-text">当前用户：趣味终端游客 (user@fun-terminal)</span>`;
                    break;
                case 'joke':
                    const jokes = [
                        "为什么程序员总是分不清万圣节和圣诞节？因为 Oct 31 = Dec 25",
                        "一个字节走进酒吧，酒保问：你喝点啥？字节说：来杯啤酒，我撑得不行了（8位撑满）",
                        "程序员的女朋友说：你能不能别总把什么都归类？程序员：你让我分个类先...",
                        "问：为什么鸟儿不喜欢用C++？答：因为它们怕遇到析构函数（destructor）"
                    ];
                    const randomJoke = jokes[Math.floor(Math.random() * jokes.length)];
                    output = `<span class="success-text">${randomJoke}</span>`;
                    break;
                case 'about':
                    output = `
                        <span class="success-text">趣味终端模拟器 v1.0</span><br>
                        基于HTML/CSS/JavaScript开发<br>
                        一个好玩又酷炫的前端终端模拟工具
                    `;
                    break;
                default:
                    // 处理echo命令
                    if (cmd.startsWith('echo ')) {
                        const echoContent = command.substring(5);
                        output = `<span class="success-text">${echoContent}</span>`;
                    } else {
                        output = `<span class="error-text">错误：未知命令 '${command}'，输入 help 查看可用命令</span>`;
                    }
                    break;
            }

            // 显示命令输出（clear命令除外）
            if (cmd !== 'clear' && output) {
                const outputLine = document.createElement('div');
                outputLine.innerHTML = output;
                terminalOutput.appendChild(outputLine);
            }

            // 重新创建输入行并滚动到底部
            terminalOutput.removeChild(document.querySelector('.input-line'));
            initInputLine();
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        // 初始化终端
        initInputLine();
    </script>
</body>
</html>
