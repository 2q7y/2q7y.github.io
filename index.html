<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经典 CMD 命令提示符</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

/* 经典 CMD 窗口 */
.cmd {
  width: 100%;
  max-width: 800px;
  height: 520px;
  background: #000;
  color: #fff;
  font-family: Consolas, monospace;
  font-size: 15px;
  padding: 16px;
  overflow-y: auto;
  border: 2px solid #555;
}

/* 原生滚动条 */
.cmd::-webkit-scrollbar {
  width: 12px;
}
.cmd::-webkit-scrollbar-track {
  background: #111;
}
.cmd::-webkit-scrollbar-thumb {
  background: #666;
}

/* 输入行 */
.input-line {
  display: flex;
  margin-top: 8px;
}

.prompt {
  white-space: nowrap;
}

#cmdInput {
  background: transparent;
  border: none;
  color: #fff;
  outline: none;
  flex: 1;
  font-family: inherit;
  font-size: inherit;
}

/* 文字简单配色 */
.help { color: #ccc; }
.err { color: #ff6666; }
.ok { color: #ffffff; }
</style>
</head>
<body>

<div class="cmd" id="cmdBody">
Microsoft Windows [版本 10.0.0000.0]<br>
(c) Microsoft Corporation。保留所有权利。<br><br>
C:\> <span class="help">输入 help 查看命令</span>
</div>

<script>
const body = document.getElementById("cmdBody");
let input;
let history = [], hidx = -1;

function newLine(){
  const div = document.createElement("div");
  div.className = "input-line";
  div.innerHTML = `<span class="prompt">C:\\></span>
  <input id="cmdInput" autocomplete="off" spellcheck="false">`;
  body.appendChild(div);
  input = document.getElementById("cmdInput");
  input.focus();
  input.onkeydown = e => {
    if(e.key === "Enter"){
      const txt = input.value.trim();
      if(txt){ history.push(txt); hidx = history.length; run(txt); }
    }
    if(e.key === "ArrowUp"){ e.preventDefault(); if(hidx>0) input.value = history[--hidx]; }
    if(e.key === "ArrowDown"){ e.preventDefault(); if(hidx<history.length-1) input.value = history[++hidx]; else input.value=""; }
  };
}

function run(cmd){
  const show = document.createElement("div");
  show.textContent = "C:\\> " + cmd;
  body.appendChild(show);
  let out = "";

  switch(cmd.toLowerCase()){
    case "help":
      out = `常用命令：help clear date whoami joke calc weather color dice password sysinfo timer`;
      break;
    case "clear":
      body.innerHTML = ""; newLine(); return;
    case "date":
      out = "现在时间：" + new Date().toLocaleString();
      break;
    case "whoami":
      out = "当前用户：Administrator";
      break;
    case "joke":
      out = "为什么CMD从不崩溃？因为它没有GUI，也从不做梦。";
      break;
    default:
      out = "不是内部或外部命令，也不是可运行的程序。";
  }

  if(out){
    const d = document.createElement("div");
    d.textContent = out;
    body.appendChild(d);
  }

  body.removeChild(document.querySelector(".input-line"));
  newLine();
  body.scrollTop = body.scrollHeight;
}

newLine();
</script>
</body>
</html>
