<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球点击计数器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f0f4f8;
            gap: 30px;
            padding: 20px;
        }

        #clickBtn {
            padding: 25px 60px;
            font-size: 28px;
            font-weight: bold;
            background: #ff3e6c;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 62, 108, 0.3);
            transition: transform 0.15s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #clickBtn:active {
            transform: scale(0.95);
        }

        #count {
            font-size: 80px;
            font-weight: bold;
            color: #2d3748;
        }

        .tip {
            font-size: 16px;
            color: #718096;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="tip">🌍 全世界共用一个计数器</div>
    <button id="clickBtn">点我 +1</button>
    <div id="count">0</div>
    <div class="tip">任何设备都能点 · 实时同步</div>

    <script>
        // 稳定国内可用接口
        const COUNT_KEY = "global_click_counter_12345";
        const countEl = document.getElementById("count");
        const clickBtn = document.getElementById("clickBtn");

        // 初始化计数
        async function loadCount() {
            try {
                let res = await fetch(`https://api.countapi.xyz/get/${COUNT_KEY}`);
                let data = await res.json();
                countEl.textContent = data.value || 0;
            } catch (e) {
                countEl.textContent = "0";
            }
        }

        // 点击 +1
        clickBtn.onclick = async () => {
            clickBtn.disabled = true;
            try {
                let res = await fetch(`https://api.countapi.xyz/hit/${COUNT_KEY}`);
                let data = await res.json();
                countEl.textContent = data.value;
            } catch (e) {}
            clickBtn.disabled = false;
        };

        // 页面打开就加载
        loadCount();
    </script>
</body>
