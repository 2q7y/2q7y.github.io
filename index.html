<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>只有一个按钮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
        }

        .main-btn {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3);
            user-select: none;
            box-sizing: border-box;
            transform-origin: center center;
            position: relative;
            overflow: hidden;
        }

        .main-btn:hover {
            background-color: #0056b3;
            transform: rotate(10deg) scale(1.5);
            border: 5px solid #ffffff;
            box-shadow: 0 6px 12px rgba(0, 123, 255, 0.2);
        }

        .main-btn:active {
            transform: rotate(5deg) scale(1.1) translateY(2px);
            box-shadow: 0 2px 4px rgba(0, 123, 255, 0.15);
        }

        /* 碎裂小块样式 */
        .break-piece {
            position: absolute;
            background: #007bff;
            border-radius: 2px;
            opacity: 0;
            animation: breakAnim 0.8s ease-out forwards;
        }

        /* 碎片飞散动画 */
        @keyframes breakAnim {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(0.4); }
        }
    </style>
</head>
<body>
    <button class="main-btn" id="btn">CLICK ME!</button>

    <script>
        const btn = document.getElementById('btn');
        let isBroken = false; // 标记是否已碎裂

        btn.addEventListener('click', () => {
            // 防止重复点击碎裂
            if (isBroken) return;
            isBroken = true;

            alert('触发');

            // 隐藏按钮本体
            btn.style.opacity = 0;
            // 禁用按钮（防止再次点击）
            btn.disabled = true;

            // 生成25个碎片（比之前多一点，炸裂效果更明显）
            for (let i = 0; i < 25; i++) {
                const piece = document.createElement('div');
                piece.classList.add('break-piece');

                // 随机碎片大小、飞散方向、旋转角度
                const size = Math.random() * 20 + 10;
                const x = (Math.random() - 0.5) * 150; // 飞散距离
                const y = (Math.random() - 0.5) * 150;
                const rotate = (Math.random() - 0.5) * 360;

                // 设置碎片样式
                piece.style.width = `${size}px`;
                piece.style.height = `${size}px`;
                piece.style.left = `${Math.random() * 100}%`;
                piece.style.top = `${Math.random() * 100}%`;
                piece.style.setProperty('--x', `${x}px`);
                piece.style.setProperty('--y', `${y}px`);
                piece.style.setProperty('--r', `${rotate}deg`);

                // 添加碎片到按钮容器
                btn.appendChild(piece);
            }

            // 碎片动画结束后，彻底移除按钮（可选，也可以保留空壳）
            setTimeout(() => {
                btn.remove(); // 从DOM中删除按钮，页面上完全消失
            }, 800);
        });
    </script>
</body>
</html>
