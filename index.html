<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简几何线条艺术</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#f6f6f8;
}

.line-geo-btn{
  padding:1.3rem 3.4rem;
  font-size:1.15rem;
  letter-spacing:1px;
  color:#222;
  background:transparent;
  border:1px solid #bbb;
  cursor:pointer;
  position:relative;
  transition:all .4s ease;
}

.line-geo-btn::before,
.line-geo-btn::after{
  content:"";position:absolute;width:16px;height:16px;
  border:1px solid #888;
  transition:all .4s ease;
}
.line-geo-btn::before{top:-6px;left:-6px;border-right:none;border-bottom:none;}
.line-geo-btn::after{bottom:-6px;right:-6px;border-left:none;border-top:none;}

.line-geo-btn:hover{
  color:#000;
  border-color:#555;
}
.line-geo-btn:hover::before{top:-10px;left:-10px;width:22px;height:22px;border-color:#222;}
.line-geo-btn:hover::after{bottom:-10px;right:-10px;width:22px;height:22px;border-color:#222;}

.line-geo-btn:active{transform:scale(0.98);}
</style>
</head>
<body>
<button class="line-geo-btn">几何留白</button>
</body>
</html>
