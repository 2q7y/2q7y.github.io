<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🧱 超好玩打砖块</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui,sans-serif;
}
body{
  background:#111827;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
h1{
  margin-bottom:10px;
  font-size:26px;
}
.info{
  display:flex;
  gap:20px;
  margin-bottom:10px;
  font-size:16px;
}
#canvas{
  border:3px solid #3b82f6;
  border-radius:8px;
  background:#030712;
}
#restart{
  margin-top:15px;
  padding:10px 24px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  display:none;
}
#restart:hover{
  background:#1d4ed8;
}
</style>
</head>

<body>
<h1>🧱 超好玩打砖块</h1>
<div class="info">
  <div>分数: <span id="score">0</span></div>
  <div>生命: <span id="life">3</span></div>
  <div>关卡: <span id="level">1</span></div>
</div>

<canvas id="canvas" width="600" height="500"></canvas>
<button id="restart">重新开始</button>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreText = document.getElementById('score');
const lifeText = document.getElementById('life');
const levelText = document.getElementById('level');
const restartBtn = document.getElementById('restart');

let game;
function init(){
  game = {
    paddle: {
      x: canvas.width/2 - 60,
      y: canvas.height - 30,
      w: 120,
      h: 15,
      speed: 12
    },
    ball: {
      x: canvas.width/2,
      y: canvas.height/2,
      r: 8,
      vx: 5,
      vy: -6,
      speed: 6
    },
    bricks: [],
    score: 0,
    life: 3,
    level: 1,
    over: false,
    win: false
  };
  restartBtn.style.display = 'none';
  makeBricks();
  updateUI();
}

function makeBricks(){
  const rows = 7;
  const cols = 10;
  const bw = 56;
  const bh = 22;
  const gap = 4;
  game.bricks = [];
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      game.bricks.push({
        x: x*(bw+gap) + 8,
        y: y*(bh+gap) + 40,
        w: bw,
        h: bh,
        alive: true,
        hp: y<2 ? 2 : 1,
        color: y<2 ? '#f87171' : y<4 ? '#60a5fa' : '#34d399'
      });
    }
  }
}

function updateUI(){
  scoreText.textContent = game.score;
  lifeText.textContent = game.life;
  levelText.textContent = game.level;
}

function draw(){
  ctx.fillStyle = '#030712';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 挡板
  ctx.fillStyle = '#3b82f6';
  ctx.fillRect(game.paddle.x, game.paddle.y, game.paddle.w, game.paddle.h);

  // 球
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(game.ball.x, game.ball.y, game.ball.r,0,Math.PI*2);
  ctx.fill();

  // 砖块
  game.bricks.forEach(b=>{
    if(!b.alive) return;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x,b.y,b.w,b.h);
  });

  if(game.over){
    ctx.fillStyle = '#ff3333';
    ctx.font = '40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', canvas.width/2, canvas.height/2 - 20);
    ctx.fillText('得分: '+game.score, canvas.width/2, canvas.height/2 + 20);
    restartBtn.style.display = 'block';
    return;
  }

  if(game.win){
    ctx.fillStyle = '#22cc22';
    ctx.font = '40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('恭喜通关!', canvas.width/2, canvas.height/2 - 20);
    restartBtn.style.display = 'block';
    return;
  }
}

function moveBall(){
  const b = game.ball;
  b.x += b.vx;
  b.y += b.vy;

  // 左右墙
  if(b.x < b.r || b.x > canvas.width - b.r) b.vx *= -1;
  // 顶墙
  if(b.y < b.r) b.vy *= -1;

  // 掉下去
  if(b.y > canvas.height){
    game.life--;
    updateUI();
    if(game.life <= 0){
      game.over = true;
      return;
    }
    resetBall();
  }

  // 挡板反弹
  const p = game.paddle;
  if(b.y + b.r > p.y &&
     b.y < p.y + p.h &&
     b.x > p.x &&
     b.x < p.x + p.w){
    b.vy = -Math.abs(b.vy);
    // 左右偏移反弹角度
    let hitPos = (b.x - (p.x + p.w/2)) / (p.w/2);
    b.vx = hitPos * 5;
  }

  // 砖块碰撞
  game.bricks.forEach(brick=>{
    if(!brick.alive) return;
    if(b.x + b.r > brick.x &&
       b.x - b.r < brick.x + brick.w &&
       b.y + b.r > brick.y &&
       b.y - b.r < brick.y + brick.h){

      b.vy *= -1;
      brick.hp--;
      game.score += 10;
      updateUI();
      if(brick.hp <= 0) brick.alive = false;
    }
  });

  // 胜利
  if(game.bricks.every(b=>!b.alive)){
    game.win = true;
  }
}

function resetBall(){
  const b = game.ball;
  b.x = canvas.width/2;
  b.y = canvas.height/2;
  b.vx = 5 * (Math.random()>0.5?1:-1);
  b.vy = -6;
}

// 鼠标控制
canvas.addEventListener('mousemove',e=>{
  if(game.over || game.win) return;
  const rect = canvas.getBoundingClientRect();
  game.paddle.x = Math.max(0, Math.min(
    canvas.width - game.paddle.w,
    e.clientX - rect.left - game.paddle.w/2
  ));
});

function loop(){
  if(!game.over && !game.win){
    moveBall();
  }
  draw();
  requestAnimationFrame(loop);
}

restartBtn.addEventListener('click',init);

init();
loop();
</script>
</body>
</html>
