<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>全球点击按钮</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;background:#f5f5f5}
    button{padding:20px 40px;font-size:24px;cursor:pointer;background:#4285f4;color:white;border:none;border-radius:12px}
    button:active{background:#3367d6}
    #count{font-size:32px;margin-top:20px;font-weight:bold}
  </style>
</head>
<body>
  <button id="btn">点我</button>
  <div id="count">加载中...</div>

  <script>
    // 用一个免费公共计数服务（所有人共用同一个数字）
    const counterId = "global-click-counter-123";
    const api = `https://api.countapi.xyz/hit/${counterId}`;
    const getApi = `https://api.countapi.xyz/get/${counterId}`;

    // 显示当前次数
    async function updateCount() {
      let res = await fetch(getApi);
      let data = await res.json();
      document.getElementById("count").innerText = "已点击：" + data.value + " 次";
    }

    // 点击按钮
    document.getElementById("btn").onclick = async () => {
      await fetch(api);
      updateCount();
    };

    // 初始加载
    updateCount();
  </script>
</body>
</html>
