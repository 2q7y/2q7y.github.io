<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨色备忘录 | 30分钟GalGame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", "思源黑体", sans-serif;
        }

        body {
            background: #1a1a2e;
            color: #f0f0f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 背景图层 */
        .bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("https://picsum.photos/id/175/1920/1080") no-repeat center center;
            background-size: cover;
            filter: brightness(0.4);
            z-index: -1;
        }

        /* 游戏容器 */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* 计时栏 */
        .timer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .timer-bar span {
            font-size: 1rem;
            color: #ffd700;
        }

        /* 剧情展示区 */
        .story-area {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            padding: 2rem;
            flex: 1;
            margin-bottom: 1rem;
            overflow-y: auto;
            line-height: 1.8;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .story-area::-webkit-scrollbar {
            width: 8px;
        }

        .story-area::-webkit-scrollbar-thumb {
            background: #6a0dad;
            border-radius: 4px;
        }

        /* 角色名称样式 */
        .char-name {
            color: #ff9a9e;
            font-weight: bold;
            margin-right: 0.5rem;
        }

        .kui { color: #87ceeb; } /* 夏目葵 - 天蓝色 */
        .hotaru { color: #f49ac2; } /* 月岛萤 - 粉色 */
        .protagonist { color: #98fb98; } /* 主角 - 浅绿色 */

        /* 选项按钮区 */
        .choices-area {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .choice-btn {
            background: linear-gradient(45deg, #4158d0, #c850c0);
            border: none;
            color: white;
            padding: 1rem 2rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .choice-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* 隐藏元素 */
        .hidden {
            display: none;
        }

        /* 打字机光标 */
        .typing::after {
            content: "|";
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="game-container">
        <!-- 计时栏 -->
        <div class="timer-bar">
            <span>剧情进度：<span id="progress">0%</span></span>
            <span>游玩时长：<span id="time">0分钟</span></span>
        </div>

        <!-- 剧情展示区 -->
        <div class="story-area" id="storyArea">
            欢迎来到《雨色备忘录》<br>
            按任意键开始游戏...
        </div>

        <!-- 选项按钮区 -->
        <div class="choices-area" id="choicesArea">
            <button class="choice-btn" id="startBtn">开始游戏</button>
        </div>
    </div>

    <script>
        // 全局变量
        let gameTime = 0; // 游玩时长（分钟）
        let progress = 0; // 剧情进度（%）
        let isTyping = false; // 是否正在打字机效果

        // DOM元素
        const storyArea = document.getElementById('storyArea');
        const choicesArea = document.getElementById('choicesArea');
        const progressSpan = document.getElementById('progress');
        const timeSpan = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');

        // 打字机效果函数
        function typeText(text, speed = 50, callback = null) {
            if (isTyping) return;
            isTyping = true;
            let index = 0;
            storyArea.innerHTML = '';
            storyArea.classList.add('typing');
            
            const typingInterval = setInterval(() => {
                if (index < text.length) {
                    // 处理换行符
                    if (text[index] === '\n') {
                        storyArea.innerHTML += '<br>';
                    } else {
                        storyArea.innerHTML += text[index];
                    }
                    index++;
                    // 滚动到底部
                    storyArea.scrollTop = storyArea.scrollHeight;
                } else {
                    clearInterval(typingInterval);
                    storyArea.classList.remove('typing');
                    isTyping = false;
                    if (callback) callback();
                }
            }, speed);
        }

        // 更新计时和进度
        function updateStatus(minutesAdded, progressAdded) {
            gameTime += minutesAdded;
            progress += progressAdded;
            progress = Math.min(progress, 100); // 不超过100%
            
            timeSpan.textContent = `${gameTime}分钟`;
            progressSpan.textContent = `${Math.round(progress)}%`;
        }

        // 隐藏所有按钮
        function hideChoices() {
            choicesArea.innerHTML = '';
        }

        // 创建选项按钮
        function createChoices(choices) {
            hideChoices();
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.onclick = choice.callback;
                choicesArea.appendChild(btn);
            });
        }

        // 剧情：序章 - 雨落时分（5分钟，进度17%）
        function prologue() {
            updateStatus(5, 17);
            const text = `
<span class="char-name protagonist">晴彦</span>：（收起淋湿的笔记本，抬头望向老旧书店的屋檐）<br>
<span class="char-name">旁白</span>：暴雨毫无征兆地落下，将放学的路截断。檐下已站着两个人——<br>
<span class="char-name kui">夏目葵</span>：（踮脚整理被风吹乱的海报，转身致歉）抱歉抱歉！风太大把海报吹下来了……你也是躲雨吗？<br>
<span class="char-name protagonist">晴彦</span>：嗯，本来想抄近路回家。<br>
<span class="char-name hotaru">月岛萤</span>：（突然开口，声音轻柔）这本《雨天随笔》，是你的吗？（举起掉在脚边的笔记本）
            `;
            typeText(text, 40, () => {
                createChoices([
                    {
                        text: "（对夏目葵）需要帮忙整理海报吗？",
                        callback: branchKui
                    },
                    {
                        text: "（对月岛萤）谢谢！你也喜欢这类随笔？",
                        callback: branchHotaru
                    }
                ]);
            });
        }

        // 分支1：向日葵的约定（15分钟，进度50%）
        function branchKui() {
            updateStatus(15, 50);
            const text = `
<span class="char-name protagonist">晴彦</span>：我来帮你吧，这些海报看起来不好固定。<br>
<span class="char-name kui">夏目葵</span>：（惊喜）真的吗？太谢谢你了！我是文学社的夏目葵，这是招新海报……<br>
<span class="char-name">旁白</span>：指尖偶然触碰，两人同时红了脸。雨还没停，你撑着伞陪葵走到社团教室。<br>
<span class="char-name kui">夏目葵</span>：（擦拭额头汗水）其实……我一直想邀请你加入文学社，你的作文写得很好。<br>
<span class="char-name protagonist">晴彦</span>：（看着她认真的眼睛）我会考虑的。<br>
<span class="char-name">旁白</span>：葵从抽屉里拿出一块向日葵形状的饼干，轻轻放在你手心。雨渐渐停了，夕阳穿透云层，在她发梢镀上一层金边。<br>
<span class="char-name kui">夏目葵</span>：下次……一起看雨后的向日葵吧？
            `;
            typeText(text, 40, () => {
                createChoices([
                    {
                        text: "好，我很期待",
                        callback: endKuiGood
                    },
                    {
                        text: "抱歉，我还有事",
                        callback: endKuiBad
                    }
                ]);
            });
        }

        // 分支2：萤色的诗行（15分钟，进度50%）
        function branchHotaru() {
            updateStatus(15, 50);
            const text = `
<span class="char-name protagonist">晴彦</span>：谢谢！你也喜欢这类雨天的随笔吗？<br>
<span class="char-name hotaru">月岛萤</span>：（轻轻点头）嗯，喜欢雨里的安静……这本诗集，是我外婆的。<br>
<span class="char-name">旁白</span>：萤翻开诗集，指腹划过泛黄的字迹，雨滴打在屋檐上，像温柔的节拍。<br>
<span class="char-name hotaru">月岛萤</span>：（轻声念）“雨是天空写给大地的诗，而相遇是诗里最温柔的韵脚。”<br>
<span class="char-name protagonist">晴彦</span>：（看着她专注的侧脸）很美的句子。<br>
<span class="char-name">旁白</span>：萤从口袋里拿出一枚银色的书签，上面刻着小小的萤火虫图案。<br>
<span class="char-name hotaru">月岛萤</span>：这个……送给你，下次一起读诗好吗？
            `;
            typeText(text, 40, () => {
                createChoices([
                    {
                        text: "好，一起读诗吧",
                        callback: endHotaruGood
                    },
                    {
                        text: "我不太懂诗呢",
                        callback: endHotaruBad
                    }
                ]);
            });
        }

        // 结局1：葵的美好结局（10分钟，进度33%）
        function endKuiGood() {
            updateStatus(10, 33);
            const text = `
<span class="char-name">旁白</span>：一周后，你和葵来到学校后的向日葵花田。雨后的阳光格外温暖，向日葵朝着太阳的方向盛放。<br>
<span class="char-name kui">夏目葵</span>：（笑着看向你）谢谢你愿意陪我来……其实，我早就想和你说说话了。<br>
<span class="char-name protagonist">晴彦</span>：我也是，和你在一起的时光很开心。<br>
<span class="char-name">旁白</span>：葵的脸颊泛起红晕，轻轻牵住了你的手。风吹过花田，带着向日葵的清香，这个夏天，有了最温柔的开始。<br>
<br>
【结局：向日葵的约定】
            `;
            typeText(text, 40, () => {
                createChoices([
                    {
                        text: "重新开始",
                        callback: restartGame
                    }
                ]);
            });
        }

        // 结局2：葵的普通结局（10分钟，进度33%）
        function endKuiBad() {
            updateStatus(10, 33);
            const text = `
<span class="char-name">旁白</span>：你拒绝了葵的邀请，她的眼神闪过一丝失落，但很快又恢复了笑容。<br>
<span class="char-name kui">夏目葵</span>：没关系！那……下次有机会再说吧。<br>
<span class="char-name">旁白</span>：你独自走在回家的路上，口袋里还留着那块向日葵饼干的甜味。回头望去，葵还站在社团教室门口，望着你的方向。<br>
<br>
【结局：未说出口的心意】
            `;
            typeText(text, 40, () => {
                createChoices([
                    {
                        text: "重新开始",
                        callback: restartGame
                    }
                ]);
            });
        }

        // 结局3：萤的美好结局（10分钟，进度33%）
        function endHotaruGood() {
            updateStatus(10, 33);
            const text = `
<span class="char-name">旁白</span>：周末，你和萤来到图书馆的靠窗位置。阳光透过玻璃落在书页上，萤轻声念着诗，声音像雨滴一样温柔。<br>
<span class="char-name hotaru">月岛萤</span>：（合上书，看向你）和你一起读诗，感觉诗里的世界都变得更温暖了。<br>
<span class="char-name protagonist">晴彦</span>：是因为和你在一起吧。<br>
<span class="char-name">旁白</span>：萤的脸颊微红，轻轻将头靠在你的肩上。书签在书页间闪着微光，像暗夜里的萤火虫，照亮了彼此的心跳。<br>
<br>
【结局：萤色的诗行】
            `;
            typeText(text, 40, () => {
                createChoices([
                    {
                        text: "重新开始",
                        callback: restartGame
                    }
                ]);
            });
        }

        // 结局4：萤的普通结局（10分钟，进度33%）
        function endHotaruBad() {
            updateStatus(10, 33);
            const text = `
<span class="char-name">旁白</span>：你婉拒了萤的邀请，她默默收起书签，指尖微微收紧。<br>
<span class="char-name hotaru">月岛萤</span>：（轻声）没关系……那这本诗集，就先放在你这里吧。<br>
<span class="char-name">旁白</span>：你独自回家，翻开那本诗集，夹着的书签轻轻滑落。上面的萤火虫图案，在灯光下显得格外孤单。<br>
<br>
【结局：未完成的诗】
            `;
            typeText(text, 40, () => {
                createChoices([
                    {
                        text: "重新开始",
                        callback: restartGame
                    }
                ]);
            });
        }

        // 重启游戏
        function restartGame() {
            gameTime = 0;
            progress = 0;
            updateStatus(0, 0);
            typeText("欢迎来到《雨色备忘录》<br>按任意键开始游戏...", 0, () => {
                createChoices([
                    {
                        text: "开始游戏",
                        callback: startGame
                    }
                ]);
            });
        }

        // 开始游戏
        function startGame() {
            hideChoices();
            typeText("【序章：雨落时分】", 80, () => {
                setTimeout(prologue, 500);
            });
        }

        // 初始化
        startBtn.onclick = startGame;
    </script>
</body>
</html>
