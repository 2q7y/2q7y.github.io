<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMD</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #08080a;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

/* 核心：复古CMD内核 + 现代磨砂融合 */
.cmd-terminal {
  width: 100%;
  max-width: 820px;
  height: 580px;
  background: #000000;
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 20px;
  overflow-y: auto;
  font-family: Consolas, Monaco, monospace;
  font-size: 15px;
  line-height: 1.6;
  color: #ffffff;
}

/* 现代美化原生滚动条 */
.cmd-terminal::-webkit-scrollbar {
  width: 8px;
}
.cmd-terminal::-webkit-scrollbar-track {
  background: #111111;
  border-radius: 4px;
}
.cmd-terminal::-webkit-scrollbar-thumb {
  background: #444444;
  border-radius: 4px;
}
.cmd-terminal::-webkit-scrollbar-thumb:hover {
  background: #555555;
}

/* 输入行 */
.input-line {
  display: flex;
  align-items: center;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed rgba(255, 255, 255, 0.08);
}

.prompt {
  white-space: nowrap;
  color: #cccccc;
  margin-right: 10px;
}

#cmdInput {
  background: transparent;
  border: none;
  outline: none;
  color: #ffffff;
  flex: 1;
  font-family: inherit;
  font-size: inherit;
  caret-color: #cccccc;
}

/* 文字配色 */
.text-help { color: #999999; }
.text-error { color: #ff6666; }
.text-normal { color: #ffffff; }
.text-warning { color: #ffcc66; }
.text-success { color: #88ff88; }

/* 响应式适配 */
@media (max-width: 768px) {
  .cmd-terminal {
    height: 480px;
    padding: 15px;
    font-size: 14px;
  }
}

/* ========== 新增样式：图形桌面/开始菜单/弹窗/记事本 ========== */
/* 桌面容器（默认隐藏） */
.desktop-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #00509e;
  z-index: 9998;
  display: none;
  flex-direction: column;
}

/* 任务栏 */
.taskbar {
  height: 40px;
  background: #2b2b2b;
  margin-top: auto;
  display: flex;
  align-items: center;
  padding: 0 10px;
}

/* 开始菜单按钮 */
.start-btn {
  width: 80px;
  height: 30px;
  background: #0078d7;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-family: Consolas;
}

/* 开始菜单（默认隐藏） */
.start-menu {
  position: absolute;
  bottom: 40px;
  left: 10px;
  width: 250px;
  background: #2b2b2b;
  color: white;
  border-radius: 4px;
  padding: 10px;
  display: none;
  flex-direction: column;
  gap: 8px;
  z-index: 9999;
}

/* 桌面图标 */
.desktop-icons {
  padding: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.desktop-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: white;
  cursor: pointer;
  width: 80px;
}

.icon-img {
  width: 48px;
  height: 48px;
  background: #ffffff;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  font-size: 24px;
  margin-bottom: 5px;
}

/* 记事本弹窗 */
.notepad-window {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 500px;
  height: 400px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  display: none;
  flex-direction: column;
  z-index: 10000;
}

.notepad-header {
  height: 30px;
  background: #0078d7;
  color: white;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.notepad-close {
  background: red;
  border: none;
  color: white;
  width: 20px;
  height: 20px;
  cursor: pointer;
}

.notepad-content {
  flex: 1;
  padding: 10px;
}

.notepad-textarea {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  resize: none;
  font-family: Consolas;
  font-size: 14px;
}

/* 通用弹窗样式 */
.popup-window {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  min-width: 300px;
  padding: 20px;
  background: white;
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  display: none;
  flex-direction: column;
  gap: 15px;
  z-index: 10000;
}

.popup-header {
  font-weight: bold;
  font-size: 18px;
  border-bottom: 1px solid #eee;
  padding-bottom: 10px;
}

.popup-close {
  align-self: flex-end;
  padding: 5px 10px;
  background: #0078d7;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

/* 病毒动画容器 */
.virus-animation {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.8);
  display: none;
  z-index: 9997;
  color: red;
  font-size: 20px;
  overflow: hidden;
}
</style>
</head>
<body>

<!-- 原版CMD终端（完全保留） -->
<div class="cmd-terminal" id="cmdBody">
Microsoft Windows [版本 10.0.0000.0]<br>
(c) Microsoft Corporation。保留所有权利。<br><br>
C:\> <span class="text-help">输入help查看全部命令</span>
</div>

<!-- ========== 新增DOM：图形桌面/开始菜单/弹窗等（默认隐藏） ========== -->
<!-- 桌面容器 -->
<div class="desktop-container" id="desktopContainer">
  <!-- 桌面图标 -->
  <div class="desktop-icons" id="desktopIcons">
    <div class="desktop-icon" onclick="openNotepad()">
      <div class="icon-img">📝</div>
      <div>记事本</div>
    </div>
    <div class="desktop-icon" onclick="showPopup('计算器', '这是模拟计算器程序')">
      <div class="icon-img">🧮</div>
      <div>计算器</div>
    </div>
    <div class="desktop-icon" onclick="showPopup('浏览器', '模拟Chrome浏览器')">
      <div class="icon-img">🌐</div>
      <div>浏览器</div>
    </div>
    <div class="desktop-icon" onclick="startVirusAnimation()">
      <div class="icon-img">🦠</div>
      <div>病毒动画</div>
    </div>
  </div>
  
  <!-- 任务栏 -->
  <div class="taskbar">
    <button class="start-btn" id="startBtn" onclick="toggleStartMenu()">开始</button>
  </div>
  
  <!-- 开始菜单 -->
  <div class="start-menu" id="startMenu">
    <div onclick="openNotepad()">📝 记事本</div>
    <div onclick="showPopup('AI对话', '输入ai 问题 开始对话')">🤖 AI对话</div>
    <div onclick="startVirusAnimation()">🦠 病毒动画</div>
    <div onclick="toggleDesktop()">❌ 关闭桌面</div>
    <div onclick="showPopup('关于', 'CMD增强版 | 保留原版+图形桌面')">ℹ️ 关于</div>
  </div>
</div>

<!-- 记事本弹窗 -->
<div class="notepad-window" id="notepadWindow">
  <div class="notepad-header">
    <div>记事本</div>
    <button class="notepad-close" onclick="closeNotepad()">×</button>
  </div>
  <div class="notepad-content">
    <textarea class="notepad-textarea" id="notepadTextarea" placeholder="在这里输入内容..."></textarea>
  </div>
</div>

<!-- 通用弹窗 -->
<div class="popup-window" id="popupWindow">
  <div class="popup-header" id="popupHeader">标题</div>
  <div id="popupContent">内容</div>
  <button class="popup-close" onclick="closePopup()">关闭</button>
</div>

<!-- 病毒动画容器 -->
<div class="virus-animation" id="virusAnimation">
  <div id="virusContent"></div>
  <button style="position:absolute;bottom:20px;right:20px;background:red;color:white;border:none;padding:10px;cursor:pointer;" onclick="stopVirusAnimation()">停止动画</button>
</div>

<script>
// 原版全局变量（完全保留）
const cmdBody = document.getElementById("cmdBody");
let cmdInput; // 输入框元素
let commandHistory = []; // 命令历史
let historyIndex = -1; // 历史索引
let guessNumber = null; // 猜数字游戏的随机数
let terminalTextColor = '#ffffff'; // 默认文字颜色

// ========== 原版核心函数（完全保留，无修改） ==========
function createInputLine() {
  // 移除旧的输入行（如果存在）
  const oldInputLine = document.querySelector('.input-line');
  if (oldInputLine) {
    oldInputLine.remove();
  }

  // 创建新输入行
  const inputLine = document.createElement("div");
  inputLine.className = "input-line";
  inputLine.innerHTML = `
    <span class="prompt">C:\\></span>
    <input id="cmdInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  `;
  cmdBody.appendChild(inputLine);

  // 获取输入框并绑定事件
  cmdInput = document.getElementById("cmdInput");
  cmdInput.style.color = terminalTextColor;
  cmdInput.focus();
  
  // 键盘事件（修复上下箭头+回车逻辑）
  cmdInput.addEventListener('keydown', function(e) {
    // 回车执行命令
    if (e.key === "Enter") {
      const command = this.value.trim();
      if (command) {
        // 添加到历史记录
        commandHistory.push(command);
        historyIndex = commandHistory.length;
        // 执行命令
        executeCommand(command);
        // 清空输入框
        this.value = '';
      }
      e.preventDefault(); // 阻止默认换行
    }
    // 上箭头：上一条历史
    else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (historyIndex > 0) {
        historyIndex--;
        this.value = commandHistory[historyIndex];
      }
    }
    // 下箭头：下一条历史
    else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (historyIndex < commandHistory.length - 1) {
        historyIndex++;
        this.value = commandHistory[historyIndex];
      } else {
        historyIndex = commandHistory.length;
        this.value = '';
      }
    }
  });

  // 自动滚动到底部
  cmdBody.scrollTop = cmdBody.scrollHeight;
}

// ========== 原版命令执行函数（仅新增case，不修改原有内容） ==========
function executeCommand(command) {
  // 1. 显示输入的命令（修复DOM插入逻辑）
  const commandDisplay = document.createElement("div");
  commandDisplay.textContent = `C:\\> ${command}`;
  commandDisplay.style.color = terminalTextColor;
  cmdBody.appendChild(commandDisplay);

  // 2. 解析命令
  const cmdParts = command.toLowerCase().split(/\s+/); // 修复空格分割
  const mainCmd = cmdParts[0];
  let output = "";

  // ========== 原版命令（完全保留） ==========
  switch(mainCmd) {
    // 基础命令
    case "help":
      output = `
        <span class="text-help">【所有可用命令】</span><br>
        基础指令：help | clear/cls | date/time | whoami | joke | about<br>
        扩展指令：calc [表达式] | weather [城市] | color [颜色] | dice<br>
        趣味指令：guess | password [长度] | sysinfo | timer [秒数] | echo [内容]<br>
        <span class="text-success">新增指令：desktop (开启桌面) | ai [问题] (AI对话) | notepad (记事本) | popup [标题] [内容] (弹窗) | virus (病毒动画)</span>
      `;
      break;

    case "clear":
    case "cls":
      // 清空终端并重新初始化
      cmdBody.innerHTML = `
        Microsoft Windows [版本 10.0.0000.0]<br>
        (c) Microsoft Corporation。保留所有权利。<br><br>
        C:\\> <span class="text-help">终端已清空 · 输入help查看命令</span>
      `;
      createInputLine();
      return; // 跳过后续逻辑

    case "date":
    case "time":
      output = `<span class="text-success">当前系统时间：${new Date().toLocaleString()}</span>`;
      break;

    case "whoami":
      output = `<span class="text-success">当前登录用户：Administrator (CMD管理员)</span>`;
      break;

    case "joke":
      const jokes = [
        "为什么程序员喜欢CMD？因为它从不弹窗打扰~",
        "CMD说：我不生产代码，我只是命令的搬运工",
        "古典音乐+现代编曲=JVKE，经典CMD+现代视觉=这个终端✨"
      ];
      output = `<span class="text-success">😂 ${jokes[Math.floor(Math.random() * jokes.length)]}</span>`;
      break;

    case "about":
      output = `
        <span class="text-success">【复古CMD × 现代视觉 融合终端】</span><br>
        ✨ 版本：v2.0 (增强版)<br>
        🎹 设计理念：像JVKE一样，古典内核+现代表达<br>
        🛠️ 所有命令已修复，新增图形桌面/AI/记事本/动画
      `;
      break;

    // 扩展命令（修复参数解析+错误处理）
    case "calc":
      if (cmdParts.length < 2) {
        output = `<span class="text-error">❌ 用法：calc [数学表达式] 例：calc 10+20*3</span>`;
      } else {
        try {
          // 修复表达式拼接（支持空格）
          const expr = cmdParts.slice(1).join('');
          // 安全计算（替换危险的eval，修复安全问题）
          const result = Function(`'use strict'; return (${expr})`)();
          output = `<span class="text-success">🧮 计算结果：${expr} = ${result}</span>`;
        } catch (err) {
          output = `<span class="text-error">❌ 计算错误：${err.message}</span>`;
        }
      }
      break;

    case "weather":
      const city = cmdParts.length > 1 ? cmdParts[1] : "北京";
      const weathers = ["晴", "多云", "小雨", "大雨", "阴", "雷阵雨", "小雪", "超级无敌大雪 嘻嘻嘻"];
      const temp = Math.floor(Math.random() * 400000) - 100000; // 保留你故意设置的超大温度
      const wind = `${Math.floor(Math.random() * 10) + 1}级`;
      const randomWeather = weathers[Math.floor(Math.random() * weathers.length)];
      output = `
        <span class="text-success">🌤️ ${city} 天气信息</span><br>
        ├─ 天气：${randomWeather}<br>
        ├─ 温度：${temp}℃<br>
        └─ 风力：${wind}
      `;
      break;

    case "color":
      const colorMap = {
        "white": "#ffffff",
        "green": "#88ff88",
        "red": "#ff6666",
        "blue": "#0000ff",
        "yellow": "#ffcc66",
        "purple": "#cc99ff"
      };
      if (cmdParts.length < 2) {
        output = `<span class="text-warning">⚠️ 可用颜色：${Object.keys(colorMap).join(' | ')}</span>`;
      } else {
        const color = cmdParts[1];
        if (colorMap[color]) {
          terminalTextColor = colorMap[color];
          // 批量更新所有文字颜色
          cmdBody.style.color = terminalTextColor;
          document.querySelectorAll('.text-success').forEach(el => el.style.color = terminalTextColor);
          output = `<span style="color:${terminalTextColor}">🎨 终端文字颜色已切换为：${color}</span>`;
        } else {
          output = `<span class="text-error">❌ 无效颜色！可用：${Object.keys(colorMap).join(' | ')}</span>`;
        }
      }
      break;

    case "dice":
      const diceNum = Math.floor(Math.random() * 6) + 1;
      output = `<span class="text-success">🎲 掷骰子结果：${diceNum}</span>`;
      break;

    // 趣味命令（修复游戏逻辑）
    case "guess":
      if (cmdParts.length === 1) {
        // 开始新游戏
        guessNumber = Math.floor(Math.random() * 100) + 1;
        output = `
          <span class="text-success">🎮 猜数字游戏开始！</span><br>
          <span class="text-warning">💡 我已生成1-100的随机数，输入 guess [数字] 猜一猜</span>
        `;
      } else {
        // 猜数字
        if (guessNumber === null) {
          output = `<span class="text-error">❌ 请先输入 guess 开始游戏</span>`;
        } else {
          const num = parseInt(cmdParts[1]);
          if (isNaN(num)) {
            output = `<span class="text-error">请输入有效的数字（1-100）</span>`;
          } else if (num < 1 || num > 100) {
            output = `<span class="text-warning">数字必须在1-100之间</span>`;
          } else if (num < guessNumber) {
            output = `<span class="text-warning">猜小了</span>`;
          } else if (num > guessNumber) {
            output = `<span class="text-warning">猜大了</span>`;
          } else {
            output = `<span class="text-success">恭喜猜对了!数字就是 ${guessNumber}</span>`;
            guessNumber = null; // 重置游戏
          }
        }
      }
      break;

    case "password":
      const length = cmdParts.length > 1 ? parseInt(cmdParts[1]) : 12;
      if (isNaN(length) || length < 6 || length > 32) {
        output = `<span class="text-error">❌ 密码长度必须是6-32之间的数字</span>`;
      } else {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()';
        let password = '';
        for (let i = 0; i < length; i++) {
          password += chars[Math.floor(Math.random() * chars.length)];
        }
        output = `<span class="text-success">🔑 生成随机密码：${password}</span>`;
      }
      break;

    case "sysinfo":
      output = `
        <span class="text-success">🖥️ 系统信息（模拟）</span><br>
        ├─ 版本：CMD增强版 v2.0<br>
        ├─ 功能：原版CMD + 图形桌面 + AI + 记事本 + 动画<br>
        └─ 状态：运行正常 ✅
      `;
      break;

    // 修复timer命令（异步逻辑兼容）
    case "timer":
      if (cmdParts.length < 2) {
        output = `<span class="text-error">❌ 用法：timer [秒数] 例：timer 5</span>`;
      } else {
        const seconds = parseInt(cmdParts[1]);
        if (isNaN(seconds) || seconds < 1 || seconds > 60) {
          output = `<span class="text-error">❌ 秒数必须是1-60之间的数字</span>`;
        } else {
          // 显示开始提示
          output = `<span class="text-success">⏰ 倒计时${seconds}秒开始！</span>`;
          const outputDiv = document.createElement("div");
          outputDiv.innerHTML = output;
          cmdBody.appendChild(outputDiv);
          
          // 倒计时逻辑（修复异步输入行重建）
          let count = seconds;
          const timerInterval = setInterval(() => {
            count--;
            if (count > 0) {
              const countDiv = document.createElement("div");
              countDiv.innerHTML = `<span class="text-warning">⌛ 剩余 ${count} 秒</span>`;
              cmdBody.appendChild(countDiv);
              cmdBody.scrollTop = cmdBody.scrollHeight;
            } else {
              clearInterval(timerInterval);
              const endDiv = document.createElement("div");
              endDiv.innerHTML = `<span class="text-success">🎉 倒计时结束！</span>`;
              cmdBody.appendChild(endDiv);
              // 重建输入行
              createInputLine();
            }
          }, 1000);
          
          // 跳过默认的输入行重建（等待倒计时结束）
          return;
        }
      }
      break;

    // echo命令（修复内容拼接）
    case "echo":
      if (cmdParts.length < 2) {
        output = `<span class="text-error">❌ 用法：echo [要输出的内容]</span>`;
      } else {
        const content = cmdParts.slice(1).join(' ');
        output = `<span class="text-success">📢 ${content}</span>`;
      }
      break;

    // ========== 新增命令（仅添加，不修改原有） ==========
    // 开启/关闭图形桌面
    case "desktop":
      toggleDesktop();
      output = `<span class="text-success">🖥️ 图形桌面已${document.getElementById('desktopContainer').style.display === 'flex' ? '开启' : '关闭'}</span>`;
      break;

    // AI对话
    case "ai":
      if (cmdParts.length < 2) {
        output = `<span class="text-error">❌ 用法：ai [你的问题] 例：ai 你好</span>`;
      } else {
        const question = cmdParts.slice(1).join(' ');
        // 模拟AI回复（可替换为真实API）
        const aiReplies = [
          `你问的是："${question}"，我觉得这个问题很有深度！`,
          `关于"${question}"，我的回答是：保持好奇心，继续探索～`,
          `🤖 AI回复：${question.split('').reverse().join('')}（反向加密版）`,
          `我是CMD内置AI，你问的"${question}"，答案是42（宇宙终极答案）`,
          `收到你的问题：${question}，已记录并分析，结果是：一切正常！`
        ];
        const reply = aiReplies[Math.floor(Math.random() * aiReplies.length)];
        output = `<span class="text-success">${reply}</span>`;
      }
      break;

    // 打开记事本
    case "notepad":
      openNotepad();
      output = `<span class="text-success">📝 记事本已打开</span>`;
      break;

    // 弹窗
    case "popup":
      if (cmdParts.length < 3) {
        output = `<span class="text-error">❌ 用法：popup [标题] [内容] 例：popup 提示 你好</span>`;
      } else {
        const title = cmdParts[1];
        const content = cmdParts.slice(2).join(' ');
        showPopup(title, content);
        output = `<span class="text-success">💬 弹窗已显示：${title}</span>`;
      }
      break;

    // 病毒动画
    case "virus":
      startVirusAnimation();
      output = `<span class="text-warning">🦠 病毒动画已启动（点击停止按钮可关闭）</span>`;
      break;

    // 未知命令
    default:
      output = `<span class="text-error">❌ '${command}' 不是内部或外部命令，输入 help 查看可用指令</span>`;
      break;
  }

  // 3. 显示命令输出（修复DOM插入）
  if (output) {
    const outputDiv = document.createElement("div");
    outputDiv.innerHTML = output;
    cmdBody.appendChild(outputDiv);
  }

  // 4. 重建输入行（核心修复：确保每次执行后都有输入行）
  createInputLine();
}

// ========== 新增功能函数（图形桌面/AI/记事本/弹窗/病毒动画） ==========
// 切换图形桌面显示/隐藏
function toggleDesktop() {
  const desktop = document.getElementById('desktopContainer');
  const startMenu = document.getElementById('startMenu');
  // 关闭开始菜单
  startMenu.style.display = 'none';
  // 切换桌面
  desktop.style.display = desktop.style.display === 'flex' ? 'none' : 'flex';
}

// 切换开始菜单显示/隐藏
function toggleStartMenu() {
  const startMenu = document.getElementById('startMenu');
  startMenu.style.display = startMenu.style.display === 'flex' ? 'none' : 'flex';
}

// 打开记事本
function openNotepad() {
  document.getElementById('notepadWindow').style.display = 'flex';
  // 关闭开始菜单
  document.getElementById('startMenu').style.display = 'none';
}

// 关闭记事本
function closeNotepad() {
  document.getElementById('notepadWindow').style.display = 'none';
}

// 显示通用弹窗
function showPopup(title, content) {
  const popup = document.getElementById('popupWindow');
  document.getElementById('popupHeader').textContent = title;
  document.getElementById('popupContent').textContent = content;
  popup.style.display = 'flex';
  // 关闭开始菜单
  document.getElementById('startMenu').style.display = 'none';
}

// 关闭通用弹窗
function closePopup() {
  document.getElementById('popupWindow').style.display = 'none';
}

// 病毒动画相关
let virusInterval = null;
function startVirusAnimation() {
  const virusContainer = document.getElementById('virusAnimation');
  const virusContent = document.getElementById('virusContent');
  // 清空内容
  virusContent.innerHTML = '';
  // 显示动画容器
  virusContainer.style.display = 'block';
  // 关闭开始菜单
  document.getElementById('startMenu').style.display = 'none';
  
  // 停止已有动画
  if (virusInterval) clearInterval(virusInterval);
  
  // 生成随机红色文字动画
  virusInterval = setInterval(() => {
    const text = ['⚠️ 警告 ⚠️', '🦠 病毒入侵', '💀 系统崩溃', '🔥 数据丢失', '🔴 危险 🔴'][Math.floor(Math.random() * 5)];
    const div = document.createElement('div');
    div.style.position = 'absolute';
    div.style.top = `${Math.random() * 100}vh`;
    div.style.left = `${Math.random() * 100}vw`;
    div.style.fontSize = `${16 + Math.random() * 20}px`;
    div.style.animation = `move ${2 + Math.random() * 3}s linear forwards`;
    div.textContent = text;
    
    // 添加动画样式
    const style = document.createElement('style');
    style.textContent = `
      @keyframes move {
        0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
        100% { transform: translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px) rotate(${Math.random() * 360}deg); opacity: 0; }
      }
    `;
    document.head.appendChild(style);
    
    virusContent.appendChild(div);
    
    // 移除旧元素
    if (virusContent.children.length > 50) {
      virusContent.removeChild(virusContent.firstChild);
    }
  }, 200);
}

// 停止病毒动画
function stopVirusAnimation() {
  if (virusInterval) {
    clearInterval(virusInterval);
    virusInterval = null;
  }
  document.getElementById('virusAnimation').style.display = 'none';
  document.getElementById('virusContent').innerHTML = '';
}

// ========== 原版初始化（完全保留） ==========
// 页面加载完成后创建第一个输入行
document.addEventListener('DOMContentLoaded', function() {
  createInputLine();
});
</script>
