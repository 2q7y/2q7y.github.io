<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流体呼吸艺术按钮</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:#0a0a14;
}

.flow-art-btn{
  padding:1.4rem 3.6rem;
  font-size:1.2rem;
  letter-spacing:2px;
  color:#fff;
  border:none;
  border-radius:999px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  background:linear-gradient(120deg,#6a5acd,#20b2aa,#9370db);
  background-size:300% 300%;
  box-shadow:0 8px 24px rgba(106,90,205,0.25);
  transition:transform .4s ease,box-shadow .4s ease;
  animation:flow-drift 10s ease infinite;
}

.flow-art-btn::before{
  content:"";position:absolute;inset:0;
  background:rgba(255,255,255,0.08);
  opacity:0;
  transition:opacity .5s ease;
}

.flow-art-btn:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 12px 40px rgba(106,90,205,0.4);
}
.flow-art-btn:hover::before{opacity:1;}

.flow-art-btn:active{
  transform:translateY(0) scale(1);
  box-shadow:0 6px 18px rgba(106,90,205,0.3);
}

@keyframes flow-drift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
</style>
</head>
<body>
<button class="flow-art-btn">流动诗意</button>
</body>
</html>
