<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .game-title {
            font-size: 36px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .score-box {
            font-size: 20px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        #gameCanvas {
            border: 3px solid #fff;
            border-radius: 8px;
            background: #111;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .tips {
            margin-top: 15px;
            font-size: 16px;
            opacity: 0.8;
            text-align: center;
        }

        #restartBtn {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            display: none;
        }

        #restartBtn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1 class="game-title">🐍 贪吃蛇</h1>
    <div class="score-box">得分：<span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restartBtn">重新开始</button>
    <div class="tips">方向键 ↑ ↓ ← → 控制蛇移动</div>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('score');
        const restartBtn = document.getElementById('restartBtn');

        // 游戏基础配置
        const gridSize = 20; // 格子大小
        const tileCount = canvas.width / gridSize; // 格子数量

        // 蛇的初始属性
        let snake = [
            {x: 10, y: 10}
        ];
        let dx = 0; // 水平移动速度
        let dy = 0; // 垂直移动速度

        // 食物
        let food = {x: 15, y: 15};
        let score = 0;
        let gameLoop;
        let gameOver = false;

        // 绘制游戏元素
        function drawGame() {
            // 清空画布
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制蛇
            ctx.fillStyle = '#4CAF50';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // 绘制食物
            ctx.fillStyle = '#FF5722';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // 生成随机食物
        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            
            // 避免食物生成在蛇身上
            snake.forEach(segment => {
                if(segment.x === food.x && segment.y === food.y) {
                    spawnFood();
                }
            });
        }

        // 移动蛇
        function moveSnake() {
            if(gameOver) return;

            // 创建新头部
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // 撞墙检测
            if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                endGame();
                return;
            }

            // 撞自己检测
            snake.forEach(segment => {
                if(head.x === segment.x && head.y === segment.y) {
                    endGame();
                    return;
                }
            });

            snake.unshift(head);

            // 吃到食物
            if(head.x === food.x && head.y === food.y) {
                score += 10;
                scoreText.textContent = score;
                spawnFood();
            } else {
                // 没吃到食物，删除尾部
                snake.pop();
            }
        }

        // 游戏结束
        function endGame() {
            gameOver = true;
            clearInterval(gameLoop);
            restartBtn.style.display = 'block';
            
            // 显示游戏结束文字
            ctx.fillStyle = 'red';
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束', canvas.width/2, canvas.height/2 - 20);
            ctx.font = '20px Arial';
            ctx.fillText(`最终得分：${score}`, canvas.width/2, canvas.height/2 + 20);
        }

        // 重新开始游戏
        function restartGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreText.textContent = score;
            gameOver = false;
            restartBtn.style.display = 'none';
            spawnFood();
            gameLoop = setInterval(gameUpdate, 100);
        }

        // 键盘控制
        document.addEventListener('keydown', e => {
            if(gameOver) return;

            switch(e.key) {
                case 'ArrowLeft':
                    if(dx !== 1) { // 禁止反向移动
                        dx = -1;
                        dy = 0;
                    }
                    break;
                case 'ArrowRight':
                    if(dx !== -1) {
                        dx = 1;
                        dy = 0;
                    }
                    break;
                case 'ArrowUp':
                    if(dy !== 1) {
                        dx = 0;
                        dy = -1;
                    }
                    break;
                case 'ArrowDown':
                    if(dy !== -1) {
                        dx = 0;
                        dy = 1;
                    }
                    break;
            }
        });

        // 游戏主循环
        function gameUpdate() {
            moveSnake();
            drawGame();
        }

        // 按钮事件
        restartBtn.addEventListener('click', restartGame);

        // 启动游戏
        spawnFood();
        gameLoop = setInterval(gameUpdate, 100);
    </script>
</body>
</html>
