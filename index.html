<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>只有一个按钮</title>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面整体样式 - 让按钮居中显示 */
        body {
            min-height: 100vh;
            /* 使用flex布局让按钮水平+垂直居中 */
            display: flex;
            align-items: center;
            justify-content: center;
            /* 极简背景色（可自行修改） */
            background-color: #f5f5f5;
        }

        /* 按钮核心样式 */
        .main-btn {
            /* 按钮尺寸 */
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            /* 视觉样式 - 改为渐变背景（渐变变色效果） */
            background: linear-gradient(45deg, #007bff, #0056b3);
            background-size: 200% 200%;
            color: white;
            border: none; /* 默认无边框 */
            border-radius: 8px;
            cursor: pointer;
            /* 过渡动画 - 让所有样式变化更流畅 */
            transition: all 0.2s ease;
            /* 按钮阴影 */
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3);
            /* 防止按钮文字被选中 */
            user-select: none;
            /* 预留边框空间，避免悬停时按钮位移 */
            box-sizing: border-box;
            /* 新增：设置变换原点，让缩放从中心开始 */
            transform-origin: center center;
            /* 呼吸灯基础动画 */
            animation: breath 3s ease-in-out infinite;
            /* 霓虹发光效果基础 */
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        /* 呼吸灯动画 */
        @keyframes breath {
            0% { box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3); }
            50% { box-shadow: 0 6px 15px rgba(0, 123, 255, 0.6); }
            100% { box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3); }
        }

        /* 液态波纹效果核心 */
        .main-btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s, opacity 0.6s;
            pointer-events: none;
        }

        /* 霓虹发光边框效果 */
        .main-btn::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            width: calc(100% + 4px);
            height: calc(100% + 4px);
            background: linear-gradient(45deg, #007bff, #00ffff, #007bff);
            background-size: 400%;
            z-index: -1;
            border-radius: 10px;
            animation: neonGlow 8s linear infinite;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* 霓虹发光动画 */
        @keyframes neonGlow {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        /* 鼠标悬停效果 - 核心修改部分 */
        .main-btn:hover {
            /* 渐变背景切换 */
            background-position: 100% 100%;
            /* 1. 按钮倾斜+缩放增大：rotate保持倾斜，scale(1.5)表示放大到1.5倍 */
            transform: rotate(10deg) scale(1.5);
            /* 2. 添加白色边框 */
            border: 5px solid #ffffff;
            /* 优化阴影，增强视觉效果 */
            box-shadow: 0 6px 12px rgba(0, 123, 255, 0.2);
            /* 霓虹发光显示 */
        }

        .main-btn:hover::before {
            opacity: 1;
        }

        /* 点击按下效果 */
        .main-btn:active {
            /* 保持倾斜和缩放，同时按下 */
            transform: rotate(5deg) scale(1.1) translateY(2px);
            box-shadow: 0 2px 4px rgba(0, 123, 255, 0.15);
            /* 液态波纹触发 */
        }

        .main-btn:active::after {
            width: 400px;
            height: 400px;
            opacity: 0;
        }

        /* 禁用状态（可选） */
        .main-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            transform: none;
            border: none;
            box-shadow: none;
            animation: none;
        }

        .main-btn:disabled::before,
        .main-btn:disabled::after {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 唯一的按钮元素 -->
    <button class="main-btn" onclick="alert('触发')">CLICK ME!</button>
</body>
</html>
