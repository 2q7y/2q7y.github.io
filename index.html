<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微光引路，拾见真谛</title>
<style>
body{margin:0;overflow:hidden;font-family:"PingFang SC",sans-serif;background:#f6f8fc;color:#333;}
#game{width:100vw;height:100vh;position:relative;background:linear-gradient(#e8edf7,#f6f8fc);}
.scene{width:100%;height:100%;position:absolute;top:0;left:0;transition:opacity 2s ease;opacity:0;pointer-events:none;}
.scene.active{opacity:1;pointer-events:auto;}
.char{position:absolute;bottom:12vh;width:120px;height:180px;background-size:contain;background-repeat:no-repeat;background-position:center;transition:left 1.5s ease;}
#girl{left:20%;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 180%22><path fill=%22%23e8eaf6%22 d=%22M60 20a20 20 0 1 0 0 40z%22/><path fill=%22%23f2f4ff%22 d=%22M40 60 L80 60 L90 160 L30 160z%22/></svg>');}
#boy{left:10%;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 180%22><path fill=%22%23dfe3ee%22 d=%22M60 25a18 18 0 1 0 0 36z%22/><path fill=%22%23cdd6e8%22 d=%22M42 61 L78 61 L84 155 L36 155z%22/></svg>');}
.dialog{position:absolute;bottom:8vh;left:10vw;right:10vw;padding:2rem;border-radius:16px;background:rgba(255,255,255,0.85);box-shadow:0 8px 24px rgba(0,0,0,0.08);}
.txt{font-size:1rem;line-height:1.8;margin-bottom:1rem;}
.btn{border:none;border-radius:999px;padding:0.6rem 1.4rem;background:#b3c4ee;color:#1d2b55;cursor:pointer;}
.ending{display:none;position:absolute;inset:0;background:rgba(254,255,255,0.9);z-index:9;text-align:center;padding-top:30vh;}
</style>
</head>
<body>
<div id="game">
  <!--场景1 迷茫林间-->
  <div class="scene active" id="s1">
    <div class="char" id="girl"></div>
    <div class="char" id="boy"></div>
  </div>

  <!--对话容器-->
  <div class="dialog" id="dialogBox">
    <div class="txt" id="txt"></div>
    <button class="btn" id="nextBtn">继续前行</button>
  </div>

  <!--结局黑屏温柔收束-->
  <div class="ending" id="endBox">
    <h2>你终于停下脚步</h2>
    <p>原来真谛不在远方追逐<br>而在陪伴、感受、认真活着</p>
  </div>
</div>

<script>
//剧情段落：谁说话、文字、男主状态偏移
const script=[
  {who:"girl",text:"你总是走得很急，好像害怕错过什么。",boyX:12},
  {who:"boy",text:"我想找到人生的真谛，可越追越迷茫。",boyX:14},
  {who:"girl",text:"别急着抵达，先看看风、落叶、微光。",boyX:18},
  {who:"girl",text:"很多答案不会奔跑，只会慢慢靠近愿意停留的人。",boyX:22},
  {who:"boy",text:"我好像很久没有认真感受平凡了。",boyX:26},
  {who:"girl",text:"真谛不是惊天动地的远方，而是不再内耗、珍惜当下、温柔生活。",boyX:32},
  {who:"end",text:"",boyX:40}
];

let cur=0;
const txt=document.getElementById('txt');
const btn=document.getElementById('nextBtn');
const boy=document.getElementById('boy');
const endBox=document.getElementById('endBox');

function render(){
  const s=script[cur];
  txt.innerText=(s.who==="girl"?"知夏：":"陆屿：")+s.text;
  boy.style.left=s.boyX+"%";
  if(s.who==="end"){
    document.getElementById('dialogBox').style.display="none";
    endBox.style.display="block";
  }
}
btn.onclick=()=>{
  if(cur<script.length-1){
    cur++;render();
  }
};
render();
</script>
</body>
</html>
